<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="L6 · StreamingResponse: hold back, stop sequences, many listeners"><defs><filter id="l6-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="l6-head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f5fbf"/></marker><marker id="l6-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c0392b"/></marker></defs><rect width="1000" height="430" fill="#fbfbf6"/><g filter="url(#l6-rough)"><rect x="20" y="78" width="108" height="38" rx="8" fill="#f1ebfb" stroke="#6f42c1" stroke-width="1.6"/><rect x="140" y="78" width="108" height="38" rx="8" fill="#f1ebfb" stroke="#6f42c1" stroke-width="1.6"/><rect x="260" y="78" width="108" height="38" rx="8" fill="#f1ebfb" stroke="#6f42c1" stroke-width="1.6"/><rect x="380" y="78" width="108" height="38" rx="8" fill="#f1ebfb" stroke="#6f42c1" stroke-width="1.6"/><rect x="20" y="164" width="330" height="40" rx="6" fill="#e3f4ea" stroke="#0b7a4b" stroke-width="1.6"/><rect x="350" y="164" width="120" height="40" rx="6" fill="#fbeadf" stroke="#c55a11" stroke-width="1.6"/><rect x="560" y="70" width="190" height="90" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="566" y1="101" x2="744" y2="101" stroke="#1f5fbf" stroke-width="1.2"/><rect x="800" y="50" width="180" height="58" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="806" y1="81" x2="974" y2="81" stroke="#0b7a4b" stroke-width="1.2"/><path d="M750,115 L800,79" fill="none" stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#l6-head-blue)"/><rect x="800" y="122" width="180" height="58" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><line x1="806" y1="153" x2="974" y2="153" stroke="#6b7280" stroke-width="1.2"/><path d="M750,115 L800,151" fill="none" stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#l6-head-blue)"/><rect x="800" y="194" width="180" height="58" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="806" y1="225" x2="974" y2="225" stroke="#c0392b" stroke-width="1.2"/><path d="M750,115 L800,223" fill="none" stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#l6-head-blue)"/><rect x="560" y="200" width="190" height="70" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="566" y1="231" x2="744" y2="231" stroke="#c0392b" stroke-width="1.2"/><path d="M655,200 L655,160" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#l6-head-red)"/><rect x="20" y="300" width="960" height="54" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">L6 · StreamingResponse: hold back, stop sequences, many listeners</text><text x="20" y="66" font-size="13" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">Chunks from the model (stop sequence = &quot;END&quot;)</text><text x="74" y="102" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="">&quot;Hel&quot;</text><text x="194" y="102" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="">&quot;lo wor&quot;</text><text x="314" y="102" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="">&quot;ld EN&quot;</text><text x="434" y="102" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="">&quot;D ignored&quot;</text><text x="20" y="152" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">After &quot;ld EN&quot; arrives, the buffer is:</text><text x="185" y="189" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="">&quot;Hello world &quot;  → already sent</text><text x="410" y="189" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">&quot;EN&quot; held</text><text x="20" y="228" font-size="12" fill="#c55a11" text-anchor="start" font-weight="normal" style="">held back = longest stop − 1 = 2 chars, so a split &quot;EN&quot;+&quot;D&quot; never reaches the UI</text><text x="20" y="258" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold" style="">&quot;D&quot; arrives → &quot;END&quot; found → cut there → finish = stop_sequence</text><text x="655.0" y="92" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">StreamingResponse</text><text x="655.0" y="120" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">buffer · stops</text><text x="655.0" y="137" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">maxChunks · cancel</text><text x="890.0" y="72" font-size="13" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">UI listener</text><text x="890.0" y="100" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">onText → screen</text><text x="890.0" y="144" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold" style="">Logger</text><text x="890.0" y="172" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">onComplete</text><text x="890.0" y="216" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Metrics</text><text x="890.0" y="244" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">onError</text><text x="980" y="278" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="italic" style="">a broken listener can&#x27;t stop the rest</text><text x="655.0" y="222" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Cancellation</text><text x="655.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">volatile flag (Stop button)</text><text x="36" y="333" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">finish reason:</text><text x="170" y="333" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="bold" style="">end</text><text x="320" y="333" font-size="13" fill="#1f5fbf" text-anchor="start" font-weight="bold" style="">stop_sequence</text><text x="470" y="333" font-size="13" fill="#c55a11" text-anchor="start" font-weight="bold" style="">length</text><text x="620" y="333" font-size="13" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">cancelled</text><text x="770" y="333" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold" style="">error</text><text x="20" y="390" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">Follow-ups: bounded queue for slow listeners (backpressure) · idle timeout between chunks · build tool-call JSON only when complete</text></svg>
