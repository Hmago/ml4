<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="What every AI agent needs: trigger → loop → action, wrapped in controls"><defs><filter id="ag1-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="ag1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker></defs><rect width="1000" height="530" fill="#fbfbf6"/><g filter="url(#ag1-rough)"><rect x="20" y="76" width="170" height="104" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="107" x2="184" y2="107" stroke="#2b2b2b" stroke-width="1.2"/><rect x="220" y="56" width="520" height="290" rx="10" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="8 6"/><rect x="240" y="96" width="150" height="66" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="246" y1="127" x2="384" y2="127" stroke="#1f5fbf" stroke-width="1.2"/><rect x="410" y="96" width="150" height="66" rx="10" fill="#f3eefc" stroke="#6f42c1" stroke-width="2.2"/><line x1="416" y1="127" x2="554" y2="127" stroke="#6f42c1" stroke-width="1.2"/><rect x="580" y="96" width="140" height="66" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="586" y1="127" x2="714" y2="127" stroke="#c55a11" stroke-width="1.2"/><rect x="240" y="196" width="150" height="66" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="246" y1="227" x2="384" y2="227" stroke="#0b7a4b" stroke-width="1.2"/><rect x="410" y="196" width="150" height="66" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="416" y1="227" x2="554" y2="227" stroke="#0b7a4b" stroke-width="1.2"/><rect x="580" y="196" width="140" height="66" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="586" y1="227" x2="714" y2="227" stroke="#1f5fbf" stroke-width="1.2"/><rect x="770" y="76" width="210" height="104" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="776" y1="107" x2="974" y2="107" stroke="#2b2b2b" stroke-width="1.2"/><path d="M190,128 L220,128" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ag1-head-ink)"/><path d="M740,128 L770,128" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ag1-head-ink)"/><rect x="20" y="388" width="184" height="66" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="26" y1="419" x2="198" y2="419" stroke="#c0392b" stroke-width="1.2"/><rect x="214" y="388" width="184" height="66" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="220" y1="419" x2="392" y2="419" stroke="#c0392b" stroke-width="1.2"/><rect x="408" y="388" width="184" height="66" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="414" y1="419" x2="586" y2="419" stroke="#c55a11" stroke-width="1.2"/><rect x="602" y="388" width="184" height="66" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="608" y1="419" x2="780" y2="419" stroke="#0b7a4b" stroke-width="1.2"/><rect x="796" y="388" width="184" height="66" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="802" y1="419" x2="974" y2="419" stroke="#1f5fbf" stroke-width="1.2"/><g transform="rotate(0.3 500.0 493.0)"><rect x="23" y="474" width="960" height="46" fill="#00000014"/><rect x="20" y="470" width="960" height="46" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">What every AI agent needs: trigger → loop → action, wrapped in controls</text><text x="105.0" y="98" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Trigger</text><text x="105.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">user chat</text><text x="105.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">event / webhook</text><text x="105.0" y="164" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">schedule</text><text x="234" y="84" font-size="15" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">Agent loop</text><text x="315.0" y="118" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Instructions</text><text x="315.0" y="146" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">role · rules · goal</text><text x="485.0" y="118" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Model (LLM)</text><text x="485.0" y="146" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">thinks, picks next step</text><text x="650.0" y="118" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Tools</text><text x="650.0" y="146" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">APIs · MCP · code</text><text x="315.0" y="218" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Context</text><text x="315.0" y="246" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">RAG · repo · docs</text><text x="485.0" y="218" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Memory / state</text><text x="485.0" y="246" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">thread · notes</text><text x="650.0" y="218" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Plan + limits</text><text x="650.0" y="246" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">to-do · max steps</text><text x="480" y="300" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" font-style="italic" style="">think → act (tool) → observe result → repeat until done or a limit is hit</text><text x="875.0" y="98" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Output / action</text><text x="875.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">answer · PR comment</text><text x="875.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">ticket · email</text><text x="875.0" y="164" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(only allowed outputs)</text><text x="20" y="376" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold" style="">Wrapped around everything</text><text x="112.0" y="410" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Guardrails</text><text x="112.0" y="438" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">input + output checks</text><text x="306.0" y="410" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Permissions</text><text x="306.0" y="438" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">least privilege · sandbox</text><text x="500.0" y="410" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Human approval</text><text x="500.0" y="438" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">for risky steps</text><text x="694.0" y="410" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Evals</text><text x="694.0" y="438" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">golden set · CI gate</text><text x="888.0" y="410" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Observability</text><text x="888.0" y="438" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">traces · tokens · cost</text><g transform="rotate(0.3 500.0 493.0)"><text x="32" y="494" font-size="12" fill="#2b2b2b" font-weight="bold">Start simple: one prompt → a fixed workflow → an agent, only when the task needs it.</text></g></svg>
