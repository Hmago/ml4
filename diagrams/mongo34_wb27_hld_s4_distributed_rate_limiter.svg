<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="HLD S4: distributed rate limiter (per API key, 50 gateway nodes)"><defs><filter id="hs4-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="hs4-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="hs4-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="hs4-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker><marker id="hs4-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c0392b"/></marker></defs><rect width="1000" height="560" fill="#fbfbf6"/><g filter="url(#hs4-rough)"><rect x="20" y="200" width="120" height="80" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="231" x2="134" y2="231" stroke="#2b2b2b" stroke-width="1.2"/><rect x="170" y="200" width="130" height="80" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="176" y1="231" x2="294" y2="231" stroke="#2b2b2b" stroke-width="1.2"/><rect x="330" y="60" width="310" height="310" rx="10" fill="#f4f8ff" stroke="#1f5fbf" stroke-width="2.2"/><rect x="350" y="108" width="270" height="66" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="356" y1="139" x2="614" y2="139" stroke="#1f5fbf" stroke-width="1.2"/><rect x="350" y="195" width="270" height="66" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="356" y1="226" x2="614" y2="226" stroke="#1f5fbf" stroke-width="1.2"/><rect x="350" y="282" width="270" height="66" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="356" y1="313" x2="614" y2="313" stroke="#1f5fbf" stroke-width="1.2"/><rect x="700" y="190" width="280" height="80" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="706" y1="221" x2="974" y2="221" stroke="#0b7a4b" stroke-width="1.2"/><path d="M140,240 L170,240" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#hs4-head-ink)"/><path d="M300,240 L330,240" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#hs4-head-ink)"/><path d="M640,230 L700,230" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#hs4-head-green)"/><path d="M330,140 L80,140 L80,200" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#hs4-head-red)"/><path d="M330,422 V523 A155.0,12 0 0 0 640,523 V422" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><ellipse cx="485.0" cy="422" rx="155.0" ry="12" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><path d="M485,370 L485,410" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#hs4-head-red)" marker-start="url(#hs4-head-red)"/><rect x="20" y="420" width="270" height="95" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="26" y1="451" x2="284" y2="451" stroke="#6f42c1" stroke-width="1.2"/><path d="M290,440 L330,362" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#hs4-head-purple)"/><g transform="rotate(1.2 835.0 420.0)"><rect x="693" y="324" width="290" height="200" fill="#00000014"/><rect x="690" y="320" width="290" height="200" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">HLD S4: distributed rate limiter (per API key, 50 gateway nodes)</text><text x="80.0" y="222" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Clients</text><text x="80.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">API keys</text><text x="235.0" y="222" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Load balancer</text><text x="235.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">L4 / L7</text><text x="485" y="88" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">API gateway fleet (50 nodes)</text><text x="485.0" y="130" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">gateway 1</text><text x="485.0" y="158" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">local bucket (pre-limit hot keys)</text><text x="485.0" y="217" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">gateway 2</text><text x="485.0" y="245" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">local bucket (pre-limit hot keys)</text><text x="485.0" y="304" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">gateway 3</text><text x="485.0" y="332" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">local bucket (pre-limit hot keys)</text><text x="840.0" y="212" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Backend services</text><text x="840.0" y="240" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">only allowed requests</text><text x="670.0" y="223.0" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">allowed</text><text x="205.0" y="133.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">429 + Retry-After</text><text x="485.0" y="452" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Redis cluster</text><text x="485.0" y="474" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">token bucket per key</text><text x="485.0" y="493" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Lua script = atomic check + take</text><text x="495.0" y="394.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">check + take token</text><text x="155.0" y="442" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Limits config</text><text x="155.0" y="470" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">per tenant + route</text><text x="155.0" y="488" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">hot reload, no deploy</text><text x="306.0" y="394.0" font-size="12" fill="#6f42c1" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">limits</text><g transform="rotate(1.2 835.0 420.0)"><text x="702" y="344" font-size="12" fill="#2b2b2b" font-weight="bold">Decisions to say</text><text x="702" y="367" font-size="12" fill="#2b2b2b">key = tenant + route</text><text x="702" y="390" font-size="12" fill="#2b2b2b">Redis down → fail-open (most APIs)</text><text x="702" y="413" font-size="12" fill="#2b2b2b">   fail-closed (login, payments)</text><text x="702" y="436" font-size="12" fill="#2b2b2b">hot keys → local pre-limit</text><text x="702" y="459" font-size="12" fill="#2b2b2b">multi-region → per-region quota</text><text x="702" y="482" font-size="12" fill="#2b2b2b">respond 429 + Retry-After</text></g></svg>
