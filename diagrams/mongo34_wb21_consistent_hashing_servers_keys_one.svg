<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="Consistent hashing: servers and keys on one ring"><defs><filter id="sd1-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="sd1-head-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6b7280"/></marker><marker id="sd1-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker></defs><rect width="1000" height="510" fill="#fbfbf6"/><g filter="url(#sd1-rough)"><circle cx="250" cy="290" r="170" fill="none" stroke="#2b2b2b" stroke-width="2.2"/><circle cx="335.0" cy="142.8" r="11" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><circle cx="417.4" cy="319.5" r="11" fill="#ffffff" stroke="#c55a11" stroke-width="2"/><circle cx="294.0" cy="454.2" r="11" fill="#ffffff" stroke="#6f42c1" stroke-width="2"/><circle cx="140.7" cy="420.2" r="11" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><circle cx="80.6" cy="275.2" r="11" fill="#ffffff" stroke="#c55a11" stroke-width="2"/><circle cx="165.0" cy="142.8" r="11" fill="#ffffff" stroke="#6f42c1" stroke-width="2"/><circle cx="397.2" cy="205.0" r="5" fill="#6b7280"/><path d="M397.2,205.0 L403.6,317.1" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6" marker-end="url(#sd1-head-gray)"/><circle cx="220.5" cy="457.4" r="5" fill="#6b7280"/><path d="M220.5,457.4 L149.7,409.5" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6" marker-end="url(#sd1-head-gray)"/><circle cx="102.8" cy="205.0" r="5" fill="#6b7280"/><path d="M102.8,205.0 L172.0,154.9" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6" marker-end="url(#sd1-head-gray)"/><circle cx="220.5" cy="122.6" r="5" fill="#6b7280"/><path d="M220.5,122.6 L328.0,154.9" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6" marker-end="url(#sd1-head-gray)"/><circle cx="370.2" cy="410.2" r="11" fill="#ffffff" stroke="#0b7a4b" stroke-width="2"/><circle cx="397.2" cy="375.0" r="5" fill="#0b7a4b"/><path d="M397.2,375.0 L360.3,400.3" fill="none" stroke="#0b7a4b" stroke-width="1.4" stroke-dasharray="7 6" marker-end="url(#sd1-head-green)"/><rect x="500" y="66" width="480" height="84" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="506" y1="97" x2="974" y2="97" stroke="#c0392b" stroke-width="1.2"/><rect x="500" y="170" width="480" height="104" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="506" y1="201" x2="974" y2="201" stroke="#0b7a4b" stroke-width="1.2"/><rect x="500" y="294" width="480" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="506" y1="325" x2="974" y2="325" stroke="#1f5fbf" stroke-width="1.2"/><g transform="rotate(0.6 740.0 444.0)"><rect x="503" y="402" width="480" height="92" fill="#00000014"/><rect x="500" y="398" width="480" height="92" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Consistent hashing: servers and keys on one ring</text><text x="335.0" y="147.3" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">A</text><text x="350.0" y="120.8" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="">A#1</text><text x="417.4" y="324.0" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">B</text><text x="447.0" y="328.7" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="">B#1</text><text x="294.0" y="458.7" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">C</text><text x="301.8" y="487.2" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="">C#1</text><text x="140.7" y="424.7" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">A</text><text x="121.4" y="447.2" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="">A#2</text><text x="80.6" y="279.7" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">B</text><text x="50.8" y="276.6" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="">B#2</text><text x="165.0" y="147.3" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">C</text><text x="150.0" y="120.8" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="">C#2</text><text x="376.4" y="221.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">k1</text><text x="224.6" y="437.8" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">k2</text><text x="123.6" y="221.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">k3</text><text x="224.6" y="150.2" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">k4</text><text x="370.2" y="414.7" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">D</text><text x="394.2" y="438.2" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">D (new)</text><text x="376.4" y="367.0" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="">k5</text><text x="250" y="284" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic" style="">keys walk clockwise</text><text x="250" y="304" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic" style="">to the next server</text><text x="740.0" y="88" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Without it: hash(key) % N</text><text x="740.0" y="116" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">add 1 server → almost every key moves</text><text x="740.0" y="135" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(a cache cluster loses nearly all hits)</text><text x="740.0" y="192" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">With a ring</text><text x="740.0" y="220" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">hash servers and keys onto the same circle</text><text x="740.0" y="239" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">a key belongs to the next server clockwise</text><text x="740.0" y="258" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">add/remove a server → only ~1/N of keys move</text><text x="740.0" y="316" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Virtual nodes</text><text x="740.0" y="344" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">each server sits at many points (A#1, A#2 …)</text><text x="740.0" y="363" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">→ even load; a bigger server gets more points</text><g transform="rotate(0.6 740.0 444.0)"><text x="512" y="422" font-size="12" fill="#2b2b2b" font-weight="bold">New server D only takes keys between B#1 and D (like k5).</text><text x="512" y="444" font-size="12" fill="#2b2b2b">Used by: Cassandra, DynamoDB, cache clusters, load balancers.</text><text x="512" y="466" font-size="12" fill="#2b2b2b">MongoDB instead uses ranged/hashed chunks + a balancer.</text></g></svg>
