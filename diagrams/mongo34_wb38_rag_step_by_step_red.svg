 x="870.0" y="141" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">text index · metadata</text><text x="165" y="79.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">1</text><text x="310" y="79.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">2</text><text x="455" y="79.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">3</text><text x="20" y="282" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold" style="">ANSWER (online, per question)</text><text x="80.0" y="322" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Question</text><text x="80.0" y="350" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">user + ACL</text><text x="225.0" y="322" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Rewrite</text><text x="225.0" y="350" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">clarify · split</text><text x="385.0" y="322" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Retrieve</text><text x="385.0" y="350" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">vector + keyword</text><text x="385.0" y="367" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ ACL filter</text><text x="545.0" y="322" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Rerank</text><text x="545.0" y="350" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">best 5 of 50</text><text x="695.0" y="322" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Prompt</text><text x="695.0" y="350" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">rules + context</text><text x="695.0" y="367" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ question</text><text x="830.0" y="322" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="830.0" y="350" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">answer</text><text x="937.5" y="322" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Check</text><text x="937.5" y="350" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">cite · guard</text><text x="638.0" y="229.75" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">search</text><text x="508.5" y="403.0" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">answer + citations</text><text x="310" y="304.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">4</text><text x="485" y="304.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">5</text><text x="630" y="304.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">6</text><text x="785" y="304.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">7</text><text x="20" y="462" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">1 bad parsing → layout-aware parser</text><text x="520" y="462" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">5 found but ranked low → add a reranker</text><text x="20" y="486" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">2 chunk cut mid-thought → split by structure</text><text x="520" y="486" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">6 too much context → fewer, better chunks</text><text x="20" y="510" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">3 no metadata → can&#x27;t filter by user or date</text><text x="520" y="510" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">7 made-up answer → cite + allow &quot;I don&#x27;t know&quot;</text><text x="20" y="534" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">4 right chunk not found → hybrid + query rewrite</text><text x="520" y="534" font-size="12" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">evaluate retrieval and answers SEPARATELY</text></svg>
