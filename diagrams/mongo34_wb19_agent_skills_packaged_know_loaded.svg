<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="Agent skills: packaged know-how, loaded only when needed"><defs><filter id="ag4-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="ag4-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="ag4-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="ag4-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker></defs><rect width="1000" height="540" fill="#fbfbf6"/><g filter="url(#ag4-rough)"><rect x="20" y="60" width="350" height="150" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="91" x2="364" y2="91" stroke="#2b2b2b" stroke-width="1.2"/><rect x="410" y="60" width="570" height="66" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="416" y1="91" x2="974" y2="91" stroke="#1f5fbf" stroke-width="1.2"/><rect x="410" y="150" width="570" height="66" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="416" y1="181" x2="974" y2="181" stroke="#6f42c1" stroke-width="1.2"/><rect x="410" y="240" width="570" height="66" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="416" y1="271" x2="974" y2="271" stroke="#0b7a4b" stroke-width="1.2"/><path d="M695,126 L695,150" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag4-head-purple)"/><path d="M695,216 L695,240" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#ag4-head-green)"/><path d="M370,93 L410,93" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ag4-head-ink)"/><rect x="20" y="350" width="230" height="104" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="26" y1="381" x2="244" y2="381" stroke="#6f42c1" stroke-width="1.2"/><rect x="265" y="350" width="230" height="104" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="271" y1="381" x2="489" y2="381" stroke="#c55a11" stroke-width="1.2"/><rect x="510" y="350" width="230" height="104" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="516" y1="381" x2="734" y2="381" stroke="#1f5fbf" stroke-width="1.2"/><rect x="755" y="350" width="230" height="104" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="761" y1="381" x2="979" y2="381" stroke="#0b7a4b" stroke-width="1.2"/><g transform="rotate(0.3 500.0 500.0)"><rect x="23" y="478" width="960" height="52" fill="#00000014"/><rect x="20" y="474" width="960" height="52" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Agent skills: packaged know-how, loaded only when needed</text><text x="195.0" y="82" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">pr-review/  (one skill = a folder)</text><text x="30" y="110" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">SKILL.md  ← name, description, steps</text><text x="30" y="132" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">scripts/fetch_diff.py</text><text x="30" y="154" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">references/comment-style.md</text><text x="30" y="176" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">assets/summary-template.md</text><text x="695.0" y="82" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">1 · Advertise (always)</text><text x="695.0" y="110" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">only name + description go into the system prompt · ~100 tokens each</text><text x="695.0" y="172" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">2 · Load (when the task matches)</text><text x="695.0" y="200" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">the agent reads the full SKILL.md body · keep it under ~5k tokens</text><text x="695.0" y="262" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">3 · Use resources (only if needed)</text><text x="695.0" y="290" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">read a reference file · run a script · fill a template</text><text x="410" y="330" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">Progressive disclosure: 50 skills cost ~5k tokens until one is actually used</text><text x="135.0" y="372" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Skill</text><text x="135.0" y="400" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">how-to steps + files</text><text x="135.0" y="419" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">loaded on demand</text><text x="380.0" y="372" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Tool / MCP server</text><text x="380.0" y="400" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">an action the agent</text><text x="380.0" y="419" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">can call</text><text x="625.0" y="372" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Instructions file</text><text x="625.0" y="400" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">always-on rules</text><text x="625.0" y="419" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(AGENTS.md, copilot-</text><text x="625.0" y="438" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">instructions.md)</text><text x="870.0" y="372" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Sub-agent</text><text x="870.0" y="400" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">a separate agent</text><text x="870.0" y="419" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">with its own context</text><g transform="rotate(0.3 500.0 500.0)"><text x="32" y="498" font-size="12" fill="#2b2b2b" font-weight="bold">&quot;Review PR 123&quot; → matches pr-review → loads SKILL.md → runs scripts/fetch_diff.py →</text><text x="32" y="518" font-size="12" fill="#2b2b2b">follows comment-style.md → posts comments through a tool.</text></g></svg>
