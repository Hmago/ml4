oke-width="2" stroke-dasharray="7 6" marker-end="url(#ag5-head-green)"/><rect x="800" y="352" width="180" height="104" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="806" y1="383" x2="974" y2="383" stroke="#1f5fbf" stroke-width="1.2"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Design an AI automation (example: triage every new bug)</text><text x="105.0" y="82" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Triggers</text><text x="105.0" y="110" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">event: bug filed</text><text x="105.0" y="129" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">schedule: nightly</text><text x="105.0" y="148" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">manual: /triage</text><text x="305.0" y="82" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Gate</text><text x="305.0" y="110" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">idempotency key</text><text x="305.0" y="129" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">dedupe · rate limit</text><text x="305.0" y="148" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">kill switch off?</text><text x="434" y="84" font-size="15" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">Run</text><text x="595.0" y="118" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Fixed steps (code)</text><text x="595.0" y="146" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">fetch bug · logs · similar bugs</text><text x="595.0" y="188" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Agent step (LLM)</text><text x="595.0" y="216" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">classify · find duplicate · owner</text><text x="595.0" y="258" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Validate (code)</text><text x="595.0" y="286" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">schema check · confidence ≥ 0.8</text><text x="890.0" y="82" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Safe outputs</text><text x="890.0" y="110" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">add label · comment</text><text x="890.0" y="129" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">link duplicate</text><text x="890.0" y="148" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">open draft PR</text><text x="890.0" y="218" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Human approval</text><text x="890.0" y="246" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">close · merge ·</text><text x="890.0" y="265" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">email customers</text><text x="769.0" y="208.6" font-size="11" fill="#0b7a4b" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">ok</text><text x="205.0" y="374" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Failures</text><text x="205.0" y="402" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">retry with backoff (steps are idempotent)</text><text x="205.0" y="421" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">give up → dead-letter queue + alert</text><text x="205.0" y="440" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">timeouts · max steps · $ budget</text><text x="595.0" y="392" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">State in MongoDB</text><text x="595.0" y="414" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">run log · idempotency keys</text><text x="595.0" y="433" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">checkpoints · results</text><text x="890.0" y="374" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Notify + measure</text><text x="890.0" y="402" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Teams / email</text><text x="890.0" y="421" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">traces · cost</text><text x="890.0" y="440" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">weekly accuracy</text></svg>
