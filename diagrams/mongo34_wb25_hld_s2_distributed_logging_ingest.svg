<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="HLD S2: distributed logging (ingest ~500 MB/s, search 14 days, keep 1 year)"><defs><filter id="hs2-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="hs2-head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f5fbf"/></marker><marker id="hs2-head-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6b7280"/></marker><marker id="hs2-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="hs2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="hs2-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker><marker id="hs2-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c0392b"/></marker></defs><rect width="1000" height="545" fill="#fbfbf6"/><g filter="url(#hs2-rough)"><rect x="20" y="190" width="120" height="80" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="221" x2="134" y2="221" stroke="#2b2b2b" stroke-width="1.2"/><rect x="170" y="190" width="150" height="80" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="176" y1="221" x2="314" y2="221" stroke="#1f5fbf" stroke-width="1.2"/><rect x="350" y="190" width="160" height="80" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="356" y1="221" x2="504" y2="221" stroke="#6f42c1" stroke-width="1.2"/><rect x="545" y="160" width="190" height="140" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="551" y1="191" x2="729" y2="191" stroke="#c55a11" stroke-width="1.2"/><path d="M780,67 V158 A100.0,12 0 0 0 980,158 V67" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><ellipse cx="880.0" cy="67" rx="100.0" ry="12" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><rect x="780" y="200" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="786" y1="231" x2="974" y2="231" stroke="#1f5fbf" stroke-width="1.2"/><path d="M780,312 V403 A100.0,12 0 0 0 980,403 V312" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><ellipse cx="880.0" cy="312" rx="100.0" ry="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><rect x="545" y="345" width="190" height="75" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="551" y1="376" x2="729" y2="376" stroke="#c0392b" stroke-width="1.2"/><path d="M140,230 L170,230" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#hs2-head-ink)"/><path d="M320,230 L350,230" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#hs2-head-blue)"/><path d="M510,230 L545,230" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#hs2-head-purple)"/><path d="M735,190 L780,122" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#hs2-head-green)"/><path d="M735,270 L780,352" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#hs2-head-gray)"/><path d="M880,200 L880,170" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#hs2-head-blue)"/><path d="M880,270 L880,300" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#hs2-head-blue)"/><path d="M640,300 L640,345" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#hs2-head-red)"/><g transform="rotate(-1.5 185.0 405.0)"><rect x="23" y="324" width="330" height="170" fill="#00000014"/><rect x="20" y="320" width="330" height="170" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">HLD S2: distributed logging (ingest ~500 MB/s, search 14 days, keep 1 year)</text><text x="80.0" y="212" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Apps</text><text x="80.0" y="240" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">10k services</text><text x="245.0" y="212" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Agent</text><text x="245.0" y="240" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Fluent Bit</text><text x="245.0" y="257" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">local disk buffer</text><text x="430.0" y="212" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Kafka</text><text x="430.0" y="240" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">topic per tenant</text><text x="430.0" y="257" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">replayable</text><text x="640.0" y="182" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Stream processors</text><text x="555" y="210" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">parse → JSON</text><text x="555" y="229" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">enrich (service, env)</text><text x="555" y="248" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">redact PII</text><text x="555" y="267" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">sample debug logs</text><text x="880.0" y="97" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Hot store</text><text x="880.0" y="119" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">search index</text><text x="880.0" y="138" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">daily partitions · 14 d</text><text x="880.0" y="222" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Query API / UI</text><text x="880.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">fan-out by time range</text><text x="880.0" y="342" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold" style="">Cold store</text><text x="880.0" y="364" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Parquet on object storage</text><text x="880.0" y="383" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">1 year · Trino / Spark</text><text x="640.0" y="367" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Alert rules</text><text x="640.0" y="395" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">run on the stream</text><text x="640.0" y="412" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">→ pager / Slack</text><text x="755.25" y="152.4" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">index</text><text x="755.25" y="320.9" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">archive</text><g transform="rotate(-1.5 185.0 405.0)"><text x="32" y="344" font-size="12" fill="#2b2b2b" font-weight="bold">Back-of-envelope</text><text x="32" y="368" font-size="12" fill="#2b2b2b">1M lines/s × 500 B ≈ 500 MB/s</text><text x="32" y="392" font-size="12" fill="#2b2b2b">≈ 43 TB/day raw (5–10× compressed)</text><text x="32" y="416" font-size="12" fill="#2b2b2b">retention = drop a whole day partition</text><text x="32" y="440" font-size="12" fill="#2b2b2b">per-tenant quotas stop noisy services</text></g><text x="20" y="530" font-size="12" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">Kafka absorbs spikes · agents buffer to disk when Kafka is down · under pressure, drop debug logs first</text></svg>
