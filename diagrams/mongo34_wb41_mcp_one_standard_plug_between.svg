<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="MCP: one standard plug between AI apps and tools (think USB-C)"><defs><filter id="ai9-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="ai9-head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f5fbf"/></marker><marker id="ai9-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="ai9-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="ai9-head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c55a11"/></marker><marker id="ai9-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker></defs><rect width="1000" height="600" fill="#fbfbf6"/><g filter="url(#ai9-rough)"><rect x="20" y="56" width="300" height="310" rx="10" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="8 6"/><rect x="40" y="116" width="260" height="66" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="46" y1="147" x2="294" y2="147" stroke="#6f42c1" stroke-width="1.2"/><rect x="40" y="214" width="260" height="132" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="46" y1="245" x2="294" y2="245" stroke="#6f42c1" stroke-width="1.2"/><path d="M170,182 L170,214" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai9-head-purple)" marker-start="url(#ai9-head-purple)"/><rect x="560" y="60" width="220" height="88" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="566" y1="91" x2="774" y2="91" stroke="#0b7a4b" stroke-width="1.2"/><path d="M780,104 L820,104" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#ai9-head-green)"/><rect x="560" y="168" width="220" height="88" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="566" y1="199" x2="774" y2="199" stroke="#1f5fbf" stroke-width="1.2"/><path d="M780,212 L820,212" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#ai9-head-blue)"/><rect x="560" y="276" width="220" height="88" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="566" y1="307" x2="774" y2="307" stroke="#c55a11" stroke-width="1.2"/><path d="M780,320 L820,320" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#ai9-head-orange)"/><path d="M820,72 V136 A80.0,12 0 0 0 980,136 V72" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><ellipse cx="900.0" cy="72" rx="80.0" ry="12" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><rect x="820" y="168" width="160" height="88" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="826" y1="199" x2="974" y2="199" stroke="#1f5fbf" stroke-width="1.2"/><rect x="820" y="276" width="160" height="88" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="826" y1="307" x2="974" y2="307" stroke="#c55a11" stroke-width="1.2"/><path d="M300,240 L560,104" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai9-head-ink)" marker-start="url(#ai9-head-ink)"/><path d="M300,280 L560,212" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai9-head-ink)" marker-start="url(#ai9-head-ink)"/><path d="M300,320 L560,320" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai9-head-ink)" marker-start="url(#ai9-head-ink)"/><rect x="20" y="410" width="220" height="92" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="26" y1="441" x2="234" y2="441" stroke="#c0392b" stroke-width="1.2"/><rect x="260" y="410" width="220" height="92" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="266" y1="441" x2="474" y2="441" stroke="#1f5fbf" stroke-width="1.2"/><rect x="500" y="410" width="220" height="92" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="506" y1="441" x2="714" y2="441" stroke="#6f42c1" stroke-width="1.2"/><g transform="rotate(1.2 862.0 454.0)"><rect x="747" y="400" width="236" height="116" fill="#00000014"/><rect x="744" y="396" width="236" height="116" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g><rect x="20" y="524" width="960" height="66" rx="10" fill="#f4f4ee" stroke="#2b2b2b" stroke-width="1.4"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">MCP: one standard plug between AI apps and tools (think USB-C)</text><text x="170" y="82" font-size="15" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Host = the AI app</text><text x="170" y="102" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">VS Code Copilot · Claude · Copilot Studio</text><text x="170.0" y="138" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="170.0" y="166" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">picks a tool + arguments</text><text x="170.0" y="236" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">MCP clients</text><text x="170.0" y="264" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">1 client per server</text><text x="170.0" y="288" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">lists the server&#x27;s tools</text><text x="170.0" y="312" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">sends calls, gets results</text><text x="670.0" y="82" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">MongoDB MCP server</text><text x="670.0" y="110" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">find · aggregate</text><text x="670.0" y="128" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">list-collections</text><text x="670.0" y="190" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">GitHub MCP server</text><text x="670.0" y="218" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">list issues</text><text x="670.0" y="236" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">create PR</text><text x="670.0" y="298" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Files MCP server</text><text x="670.0" y="326" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">read file</text><text x="670.0" y="344" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">search files</text><text x="900.0" y="102" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">MongoDB Atlas</text><text x="900.0" y="124" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">your data</text><text x="900.0" y="190" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">GitHub</text><text x="900.0" y="218" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">repos · issues</text><text x="900.0" y="298" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Local disk</text><text x="900.0" y="326" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">your files</text><text x="430.0" y="166.0" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">remote: Streamable HTTP</text><text x="430.0" y="240.0" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">JSON-RPC messages</text><text x="430.0" y="314.0" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">local: stdio</text><text x="20" y="398" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold" style="">What a server offers</text><text x="130.0" y="432" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Tools</text><text x="130.0" y="460" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">actions the model calls</text><text x="130.0" y="479" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">e.g. run find()</text><text x="370.0" y="432" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Resources</text><text x="370.0" y="460" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">data the app reads</text><text x="370.0" y="479" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">e.g. a collection schema</text><text x="610.0" y="432" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Prompts</text><text x="610.0" y="460" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">templates the user picks</text><text x="610.0" y="479" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">e.g. &quot;explain slow query&quot;</text><g transform="rotate(1.2 862.0 454.0)"><text x="756" y="420" font-size="12" fill="#2b2b2b" font-weight="bold">Why MCP?</text><text x="756" y="439" font-size="12" fill="#2b2b2b">before: custom glue for every</text><text x="756" y="458" font-size="12" fill="#2b2b2b">app × tool pair</text><text x="756" y="477" font-size="12" fill="#2b2b2b">now: build a server once,</text><text x="756" y="496" font-size="12" fill="#2b2b2b">every AI app can use it</text></g><text x="36" y="550" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">One request:  ① on connect, the client asks tools/list   ② the LLM picks find {status: &quot;failed&quot;}</text><text x="36" y="574" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">③ the client sends tools/call   ④ the server runs it on Atlas → result goes back to the LLM → answer</text></svg>
