<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="LangGraph example: a refund agent that waits for a human"><defs><filter id="ai12-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="ai12-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="ai12-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="ai12-head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c55a11"/></marker><marker id="ai12-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker><marker id="ai12-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c0392b"/></marker></defs><rect width="1000" height="540" fill="#fbfbf6"/><g filter="url(#ai12-rough)"><rect x="20" y="66" width="90" height="40" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><rect x="150" y="56" width="170" height="62" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="156" y1="87" x2="314" y2="87" stroke="#6f42c1" stroke-width="1.2"/><rect x="410" y="56" width="180" height="62" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="416" y1="87" x2="584" y2="87" stroke="#c55a11" stroke-width="1.2"/><path d="M110,86 L150,86" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai12-head-ink)"/><path d="M320,76 L410,76" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai12-head-purple)"/><path d="M410,102 L320,102" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#ai12-head-orange)"/><path d="M235,118 L235,162" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai12-head-purple)"/><polygon points="235,162.0 310.0,197 235,232.0 160.0,197" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><rect x="330" y="238" width="220" height="64" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="336" y1="269" x2="544" y2="269" stroke="#c0392b" stroke-width="1.2"/><rect x="330" y="342" width="220" height="62" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="336" y1="373" x2="544" y2="373" stroke="#0b7a4b" stroke-width="1.2"/><rect x="170" y="450" width="130" height="40" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><path d="M310,197 L440,197 L440,238" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai12-head-purple)"/><path d="M160,197 L90,197 L90,470 L170,470" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai12-head-purple)"/><path d="M440,302 L440,342" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ai12-head-red)"/><path d="M440,404 L440,470 L300,470" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#ai12-head-green)"/><rect x="620" y="52" width="360" height="112" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="626" y1="83" x2="974" y2="83" stroke="#1f5fbf" stroke-width="1.2"/><path d="M620,198 V304 A180.0,12 0 0 0 980,304 V198" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><ellipse cx="800.0" cy="198" rx="180.0" ry="12" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><path d="M550,270 L620,262" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai12-head-green)"/><g transform="rotate(0.8 800.0 426.0)"><rect x="623" y="346" width="360" height="168" fill="#00000014"/><rect x="620" y="342" width="360" height="168" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">LangGraph example: a refund agent that waits for a human</text><text x="65.0" y="88" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">START</text><text x="235.0" y="78" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">agent</text><text x="235.0" y="106" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">LLM picks next step</text><text x="500.0" y="78" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">tools</text><text x="500.0" y="106" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">find_order · policy</text><text x="365.0" y="69.0" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">tool call</text><text x="365.0" y="117.0" font-size="11" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">result</text><text x="235" y="201" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">route</text><text x="440.0" y="260" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">approve_refund</text><text x="440.0" y="288" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">interrupt(): pause for a human</text><text x="440.0" y="364" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">issue_refund</text><text x="440.0" y="392" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">calls the payments API</text><text x="235.0" y="472" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">END</text><text x="375.0" y="190.0" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">refund</text><text x="84.0" y="337.5" font-size="11" fill="#6f42c1" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">just answer</text><text x="448.0" y="337.0" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">approved</text><text x="800.0" y="74" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">State (shared, typed)</text><text x="630" y="102" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">messages: list  (new ones appended)</text><text x="630" y="122" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">order_id: &quot;A1&quot;</text><text x="630" y="142" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">approved: false</text><text x="800.0" y="228" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">MongoDB checkpointer</text><text x="800.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">MongoDBSaver saves the state after</text><text x="800.0" y="269" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">every step, keyed by thread_id</text><text x="800.0" y="288" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">→ resume · time-travel · audit</text><text x="585.0" y="259.0" font-size="11" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">save</text><g transform="rotate(0.8 800.0 426.0)"><text x="632" y="366" font-size="12" fill="#2b2b2b" font-weight="bold">Pause and resume</text><text x="632" y="386" font-size="12" fill="#2b2b2b">1 agent checks order A1 via tools</text><text x="632" y="406" font-size="12" fill="#2b2b2b">2 approve_refund calls interrupt()</text><text x="632" y="426" font-size="12" fill="#2b2b2b">   → run stops, state is in MongoDB</text><text x="632" y="446" font-size="12" fill="#2b2b2b">3 next day a manager approves</text><text x="632" y="466" font-size="12" fill="#2b2b2b">   → resume the same thread_id</text><text x="632" y="486" font-size="12" fill="#2b2b2b">   → issue_refund → END</text></g></svg>
