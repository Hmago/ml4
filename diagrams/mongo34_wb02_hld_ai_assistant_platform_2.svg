><text x="515" y="419" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" style="">Guardrails (output) → stream</text><text x="350" y="397.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">7</text><text x="860.0" y="84" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LLM provider A</text><text x="860.0" y="112" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">primary</text><text x="860.0" y="154" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LLM provider B</text><text x="860.0" y="182" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">fallback</text><text x="860.0" y="252" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">MongoDB Atlas</text><text x="860.0" y="274" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">chats · checkpoints</text><text x="860.0" y="293" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">chunks + vectors</text><text x="860.0" y="312" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">response cache (TTL)</text><text x="825.0" y="377" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Tools / MCP</text><text x="825.0" y="405" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">logs · metrics</text><text x="825.0" y="423" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">tickets</text><text x="860.0" y="492" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Ingestion jobs</text><text x="860.0" y="520" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">docs → chunk → embed</text><text x="515.0" y="510" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Observability + evals</text><text x="515.0" y="538" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">traces · tokens · $ · eval runs in CI</text><text x="154.0" y="283.0" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">1</text><text x="725.0" y="154.25" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">chat()</text><text x="713.0" y="219.7" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">read/write</text><text x="716.0" y="353.0" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">tools</text><text x="944.0" y="412.35" font-size="12" fill="#1f5fbf" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">upsert</text><g transform="rotate(-2 164.5 455.0)"><text x="34" y="404" font-size="13" fill="#2b2b2b" font-weight="bold">NFRs</text><text x="34" y="424" font-size="13" fill="#2b2b2b">p95 &lt; 3 s (1st token &lt; 1 s)</text><text x="34" y="444" font-size="13" fill="#2b2b2b">99.9% · $ budget / request</text><text x="34" y="464" font-size="13" fill="#2b2b2b">no PII or secret leaks</text><text x="34" y="484" font-size="13" fill="#2b2b2b">per-tenant isolation</text></g><text x="20" y="585" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">Numbers = request path. In the LLD round, pick one box (e.g. ⑥ LLM client) and design its classes.</text></svg>
