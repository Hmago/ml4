<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="LLD whiteboard: how to lay out the board (example: LLM client)"><defs><filter id="wb1-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="wb1-head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c55a11"/></marker><marker id="wb1-tri-purple" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fbfbf6" stroke="#6f42c1" stroke-width="1.4"/></marker></defs><rect width="1000" height="615" fill="#fbfbf6"/><g filter="url(#wb1-rough)"><rect x="20" y="55" width="300" height="245" rx="10" fill="none" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="8 6"/><rect x="340" y="55" width="300" height="245" rx="10" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="8 6"/><rect x="660" y="55" width="320" height="245" rx="10" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="8 6"/><rect x="20" y="318" width="620" height="285" rx="10" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="8 6"/><rect x="40" y="375" width="100" height="46" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><rect x="160" y="375" width="100" height="46" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><rect x="280" y="375" width="100" height="46" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><rect x="400" y="375" width="100" height="46" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><rect x="520" y="375" width="100" height="46" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><path d="M140,398 L160,398" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#wb1-head-orange)"/><path d="M260,398 L280,398" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#wb1-head-orange)"/><path d="M380,398 L400,398" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#wb1-head-orange)"/><path d="M500,398 L520,398" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#wb1-head-orange)"/><rect x="240" y="520" width="180" height="62" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><path d="M210,421 L267.0,520" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb1-tri-purple)"/><path d="M330,421 L309.0,520" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb1-tri-purple)"/><path d="M450,421 L351.0,520" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb1-tri-purple)"/><path d="M570,421 L393.0,520" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb1-tri-purple)"/><rect x="660" y="318" width="320" height="285" rx="10" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">LLD whiteboard: how to lay out the board (example: LLM client)</text><text x="34" y="83" font-size="15" fill="#1f5fbf" text-anchor="start" font-weight="bold" style="">① Requirements · 0–5 min</text><text x="36" y="111" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">✓ chat(request) → response</text><text x="36" y="135" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">✓ retry 429 / 5xx</text><text x="36" y="159" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">✓ fall back to a 2nd provider</text><text x="36" y="183" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">✓ tokens + $ per model</text><text x="36" y="207" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal" style="">✗ streaming (out of scope)</text><text x="36" y="231" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">NFR: p95 &lt; 2 s · 100 rps</text><text x="36" y="255" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">shared by many threads? yes</text><text x="354" y="83" font-size="15" fill="#0b7a4b" text-anchor="start" font-weight="bold" style="">② Entities · 5–12 min</text><text x="356" y="111" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">LlmClient: send a request</text><text x="356" y="135" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Adapter: SDK → our API</text><text x="356" y="159" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">RetryPolicy: when, how long</text><text x="356" y="183" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">CircuitBreaker: skip bad one</text><text x="356" y="207" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Meter: tokens → $</text><text x="356" y="231" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">nouns → classes</text><text x="356" y="255" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">verbs → methods</text><text x="674" y="83" font-size="15" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">③ Interfaces FIRST · 12–20</text><text x="676" y="111" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">interface LlmClient {</text><text x="676" y="137" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">  ChatResponse chat(ChatRequest r);</text><text x="676" y="163" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">}</text><text x="676" y="189" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">record ChatRequest(model, msgs, temp)</text><text x="676" y="215" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">record ChatResponse(text, usage)</text><text x="676" y="241" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">LlmException(retryable, retryAfter)</text><text x="34" y="346" font-size="15" fill="#c55a11" text-anchor="start" font-weight="bold" style="">④ Classes + main flow · 20–45 min</text><text x="90.0" y="397" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Caller</text><text x="210.0" y="397" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Metered</text><text x="330.0" y="397" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Fallback</text><text x="450.0" y="397" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Retrying</text><text x="570.0" y="397" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">OpenAI</text><text x="150.0" y="391.0" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">calls</text><text x="270.0" y="391.0" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">wraps</text><text x="390.0" y="391.0" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">wraps</text><text x="510.0" y="391.0" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">wraps</text><text x="330.0" y="537" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" font-style="italic" style="">«interface»</text><text x="330.0" y="555" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LlmClient</text><text x="450" y="548" font-size="12" fill="#6f42c1" text-anchor="start" font-weight="normal" style="">every box implements</text><text x="450" y="568" font-size="12" fill="#6f42c1" text-anchor="start" font-weight="normal" style="">LlmClient → stack any order</text><text x="674" y="346" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold" style="">⑤ Edge cases + trade-offs</text><text x="676" y="374" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">429 → honor Retry-After</text><text x="676" y="401" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">400 → never retry</text><text x="676" y="428" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">interrupt → restore flag, stop</text><text x="676" y="455" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">all providers down → clear error</text><text x="676" y="482" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">+ decorators: testable, OCP</text><text x="676" y="509" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal" style="">− more objects to wire</text><text x="676" y="536" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">next: async · budgets · tracing</text></svg>
