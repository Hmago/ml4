<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="Memory in Microsoft Copilot: short-term vs long-term"><defs><filter id="ai6-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="1000" height="590" fill="#fbfbf6"/><g filter="url(#ai6-rough)"><rect x="196" y="52" width="250" height="64" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><rect x="454" y="52" width="250" height="64" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><rect x="712" y="52" width="250" height="64" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><rect x="20" y="132" width="960" height="108" rx="10" fill="#eef5ff" stroke="#1f5fbf" stroke-width="1.6"/><rect x="196" y="140" width="250" height="92" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><rect x="454" y="140" width="250" height="92" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><rect x="712" y="140" width="250" height="92" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><rect x="20" y="256" width="960" height="138" rx="10" fill="#eefaf2" stroke="#0b7a4b" stroke-width="1.6"/><rect x="196" y="264" width="250" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><rect x="454" y="264" width="250" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><rect x="712" y="264" width="250" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><rect x="20" y="410" width="960" height="118" rx="10" fill="#fff6e8" stroke="#c55a11" stroke-width="1.6"/><rect x="196" y="418" width="250" height="102" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><rect x="454" y="418" width="250" height="102" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><rect x="712" y="418" width="250" height="102" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><g transform="rotate(0 500.0 556.0)"><rect x="23" y="540" width="960" height="40" fill="#00000014"/><rect x="20" y="536" width="960" height="40" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Memory in Microsoft Copilot: short-term vs long-term</text><text x="321.0" y="78" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Microsoft 365</text><text x="321.0" y="100" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Copilot Chat</text><text x="579.0" y="78" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Copilot Studio</text><text x="579.0" y="100" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">agents (low-code)</text><text x="837.0" y="78" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Pro-code agents</text><text x="837.0" y="100" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">SDK · Foundry · Agent Framework</text><text x="30" y="182.0" font-size="14" fill="#1f5fbf" text-anchor="start" font-weight="bold" style="">SHORT-TERM</text><text x="30" y="202.0" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="">this chat</text><text x="208" y="180.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">The current conversation</text><text x="208" y="199.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">is the context</text><text x="466" y="180.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Uses the last 10 turns to</text><text x="466" y="199.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">pick tools and fill inputs</text><text x="724" y="171.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Thread trims old messages:</text><text x="724" y="190.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">drop middle / keep last N</text><text x="724" y="209.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">or summarize (reducer)</text><text x="30" y="321.0" font-size="14" fill="#0b7a4b" text-anchor="start" font-weight="bold" style="">LONG-TERM</text><text x="30" y="341.0" font-size="12" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">across chats</text><text x="208" y="291.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Copilot Memory:</text><text x="208" y="310.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">• facts you ask it to save</text><text x="208" y="329.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">• learned from past chats</text><text x="208" y="348.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">• custom instructions</text><text x="208" y="367.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">• work insights (mail, Teams)</text><text x="466" y="300.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Memory (preview):</text><text x="466" y="319.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">one store per agent per user</text><text x="466" y="338.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">deleted after 28 days idle</text><text x="466" y="357.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">off in group chats</text><text x="724" y="300.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">You build it:</text><text x="724" y="319.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">user + conversation state</text><text x="724" y="338.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">in Cosmos DB / Blob</text><text x="724" y="357.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">+ your own memory store</text><text x="30" y="465.0" font-size="14" fill="#c55a11" text-anchor="start" font-weight="bold" style="">STORED +</text><text x="30" y="485.0" font-size="12" fill="#c55a11" text-anchor="start" font-weight="normal" style="">CONTROLS</text><text x="208" y="444.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Hidden folder in the</text><text x="208" y="463.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">user&#x27;s mailbox</text><text x="208" y="482.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">temporary chat = no memory</text><text x="208" y="501.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">admin switch + eDiscovery</text><text x="466" y="454.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Maker turns it on / off</text><text x="466" y="473.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">user asks &quot;what do you</text><text x="466" y="492.0" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">remember?&quot; or uses a portal</text><text x="724" y="463.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Your database,</text><text x="724" y="482.5" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">your rules</text><g transform="rotate(0 500.0 556.0)"><text x="32" y="560" font-size="12" fill="#2b2b2b" font-weight="bold">Same pattern as F13: short-term is trimmed to fit the window; long-term is small, per user, visible, deletable and expires.</text></g></svg>
