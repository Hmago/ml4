fka</text><text x="550.0" y="285" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">partition by PK</text><text x="750.0" y="162" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Transform + load</text><text x="750.0" y="190" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">mapping rules</text><text x="750.0" y="208" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">upsert, _id = PK</text><text x="750.0" y="226" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(idempotent)</text><text x="920.0" y="172" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">MongoDB</text><text x="920.0" y="194" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">events</text><text x="920.0" y="212" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">tickets</text><text x="920.0" y="230" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">orders</text><text x="550.0" y="132.0" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">bulk load</text><text x="240" y="74.5" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">1</text><text x="240" y="239.5" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">2</text><text x="670" y="144.5" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">3</text><text x="380.0" y="402" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold" style="">Control plane</text><text x="380.0" y="430" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">job config · mapping spec</text><text x="380.0" y="449" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">state machine · UI · metrics</text><text x="695.0" y="402" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Verifier</text><text x="695.0" y="430" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">counts · chunk checksums</text><text x="695.0" y="449" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">sampled diffs · lag alerts (P1)</text><text x="560" y="384.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">4</text><text x="920.0" y="370" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Cutover</text><text x="920.0" y="398" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">shadow reads</text><text x="920.0" y="416" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">flip writes</text><text x="920.0" y="434" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(feature flag)</text><text x="920.0" y="452" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">reverse CDC</text><text x="855" y="352.5" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">5</text><text x="377.5" y="506.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">compare source vs target</text><text x="388.0" y="347.5" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">runs</text><text x="20" y="545" font-size="12" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">No gap: record CDC position BEFORE the snapshot · safe replays: upsert with _id = source PK · per-row order: partition by PK</text></svg>
