<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="LLD: LLM client = Adapter + Decorators (L1)"><defs><filter id="wb3-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="wb3-dia-red" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="18" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#c0392b"/></marker><marker id="wb3-tri-orange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fbfbf6" stroke="#c55a11" stroke-width="1.4"/></marker><marker id="wb3-tri-purple" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fbfbf6" stroke="#6f42c1" stroke-width="1.4"/></marker></defs><rect width="1000" height="600" fill="#fbfbf6"/><g filter="url(#wb3-rough)"><rect x="380" y="55" width="260" height="82" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="386" y1="99" x2="634" y2="99" stroke="#1f5fbf" stroke-width="1.2"/><rect x="30" y="205" width="190" height="66" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="36" y1="236" x2="214" y2="236" stroke="#6f42c1" stroke-width="1.2"/><rect x="30" y="290" width="190" height="66" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="36" y1="321" x2="214" y2="321" stroke="#6f42c1" stroke-width="1.2"/><path d="M220,225 L395,137" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb3-tri-purple)"/><path d="M220,310 L410,137" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb3-tri-purple)"/><rect x="250" y="215" width="170" height="130" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="256" y1="246" x2="414" y2="246" stroke="#c55a11" stroke-width="1.2"/><path d="M335,215 L466.25,137" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb3-tri-orange)"/><rect x="435" y="215" width="170" height="130" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="441" y1="246" x2="599" y2="246" stroke="#c55a11" stroke-width="1.2"/><path d="M520,215 L512.5,137" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb3-tri-orange)"/><rect x="620" y="215" width="170" height="130" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="626" y1="246" x2="784" y2="246" stroke="#c55a11" stroke-width="1.2"/><path d="M705,215 L558.75,137" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb3-tri-orange)"/><rect x="805" y="215" width="170" height="130" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="811" y1="246" x2="969" y2="246" stroke="#c55a11" stroke-width="1.2"/><path d="M890,215 L605.0,137" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#wb3-tri-orange)"/><rect x="435" y="400" width="170" height="86" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="441" y1="431" x2="599" y2="431" stroke="#c0392b" stroke-width="1.2"/><path d="M520,345 L520,400" fill="none" stroke="#c0392b" stroke-width="2" marker-start="url(#wb3-dia-red)"/><rect x="30" y="395" width="380" height="140" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><line x1="36" y1="426" x2="404" y2="426" stroke="#6b7280" stroke-width="1.2"/><g transform="rotate(1.2 805.0 475.0)"><rect x="633" y="404" width="350" height="150" fill="#00000014"/><rect x="630" y="400" width="350" height="150" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">LLD: LLM client = Adapter + Decorators (L1)</text><text x="510.0" y="72" font-size="11" fill="#1f5fbf" text-anchor="middle" font-weight="normal" font-style="italic" style="">«interface»</text><text x="510.0" y="90" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">LlmClient</text><text x="390" y="118" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">chat(ChatRequest): ChatResponse</text><text x="125.0" y="227" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">OpenAiAdapter</text><text x="125.0" y="255" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">SDK → LlmClient</text><text x="125.0" y="312" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">AnthropicAdapter</text><text x="125.0" y="340" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">SDK → LlmClient</text><text x="250" y="180" font-size="12" fill="#6f42c1" text-anchor="start" font-weight="normal" style="">adapts</text><text x="335.0" y="237" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">RetryingClient</text><text x="260" y="265" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- inner: LlmClient</text><text x="260" y="284" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- maxAttempts</text><text x="260" y="303" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- sleeper</text><text x="260" y="322" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">+ backoff + jitter</text><text x="520.0" y="237" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">FallbackClient</text><text x="445" y="265" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- clients: List</text><text x="445" y="284" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- breakers: List</text><text x="445" y="303" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">+ skip open circuit</text><text x="705.0" y="237" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">BulkheadClient</text><text x="630" y="265" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- inner: LlmClient</text><text x="630" y="284" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- permits: Semaphore</text><text x="630" y="303" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">+ cap concurrency</text><text x="890.0" y="237" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">MeteredClient</text><text x="815" y="265" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- inner: LlmClient</text><text x="815" y="284" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- costByModel</text><text x="815" y="303" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">+ tokens → $</text><text x="625" y="372" font-size="12" fill="#c55a11" text-anchor="start" font-weight="normal" style="">all 4 implement LlmClient AND wrap one</text><text x="520.0" y="422" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">CircuitBreaker</text><text x="445" y="450" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">failures, openedAt</text><text x="445" y="469" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">allowRequest()</text><text x="520.0" y="376.5" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">1 per provider</text><text x="220.0" y="417" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold" style="">Value types (records)</text><text x="40" y="445" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">ChatRequest(model, messages, temperature)</text><text x="40" y="466" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">ChatResponse(text, model, usage)</text><text x="40" y="487" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Usage(inputTokens, outputTokens)</text><text x="40" y="508" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">LlmException(retryable, retryAfter)</text><g transform="rotate(1.2 805.0 475.0)"><text x="642" y="424" font-size="12" fill="#2b2b2b" font-weight="bold">Wiring (order matters)</text><text x="642" y="443" font-size="12" fill="#2b2b2b">new Metered(</text><text x="642" y="462" font-size="12" fill="#2b2b2b">  new Bulkhead(</text><text x="642" y="481" font-size="12" fill="#2b2b2b">    new Fallback(List.of(</text><text x="642" y="500" font-size="12" fill="#2b2b2b">      new Retrying(openAi),</text><text x="642" y="519" font-size="12" fill="#2b2b2b">      new Retrying(anthropic)))))</text></g><text x="30" y="580" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">Open/closed: add caching or tracing = one new decorator, zero edits to existing classes.</text></svg>
