h="6.6" stroke-linecap="round" opacity="0.85"/><path d="M429,168 Q337.0,93.12 245,168" fill="none" stroke="#1f5fbf" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/><path d="M429,168 Q383.0,122.56 337,168" fill="none" stroke="#1f5fbf" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/><rect x="20" y="250" width="630" height="150" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2"/><g transform="rotate(-1.2 170.0 480.0)"><rect x="23" y="424" width="300" height="120" fill="#00000014"/><rect x="20" y="420" width="300" height="120" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g><g transform="rotate(1.2 497.5 480.0)"><rect x="348" y="424" width="305" height="120" fill="#00000014"/><rect x="345" y="420" width="305" height="120" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g><rect x="700" y="60" width="270" height="48" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><rect x="684" y="126" width="302" height="290" rx="8" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="8 6"/><rect x="710" y="156" width="250" height="62" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="716" y1="187" x2="954" y2="187" stroke="#0b7a4b" stroke-width="1.2"/><rect x="710" y="238" width="250" height="34" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><rect x="710" y="292" width="250" height="76" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="716" y1="323" x2="954" y2="323" stroke="#c55a11" stroke-width="1.2"/><rect x="710" y="378" width="250" height="30" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><rect x="700" y="448" width="270" height="70" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="706" y1="479" x2="964" y2="479" stroke="#c0392b" stroke-width="1.2"/><path d="M835,108 L835,156" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai5-head-ink)"/><path d="M835,218 L835,238" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai5-head-ink)"/><path d="M835,272 L835,292" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai5-head-ink)"/><path d="M835,368 L835,378" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai5-head-ink)"/><path d="M835,408 L835,448" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai5-head-ink)"/><path d="M710,140 L696,140 L696,255 L710,255" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai5-head-gray)"/><path d="M710,282 L696,282 L696,393 L710,393" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai5-head-gray)"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Self-attention + one transformer block (simple view)</text><text x="61" y="197" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">The</text><text x="153" y="197" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">cat</text><text x="245" y="197" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">sat</text><text x="337" y="197" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">because</text><text x="429" y="197" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">it</text><text x="521" y="197" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">was</text><text x="613" y="197" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">tired</text><text x="245.0" y="92.12" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">0.05</text><text x="291.0" y="106.84" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">0.62</text><text x="337.0" y="121.56" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">0.08</text><text x="383.0" y="136.28" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">0.05</text><text x="447" y="158" font-size="11" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="">0.20 (itself)</text><text x="491" y="232" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">future words: masked out</text><text x="20" y="62" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="">&quot;it&quot; looks back at earlier words; thicker line = more attention → &quot;it&quot; now carries &quot;cat&quot;</text><text x="36" y="276" font-size="13" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">Query (it):</text><text x="190" y="276" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">what am I looking for?  → &quot;the noun I refer to&quot;</text><text x="36" y="301" font-size="13" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">Key (each word):</text><text x="190" y="301" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">what do I contain?</text><text x="36" y="326" font-size="13" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">Value (each word):</text><text x="190" y="326" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">what do I pass on if I&#x27;m picked?</text><text x="36" y="351" font-size="13" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">Weights:</text><text x="190" y="351" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">softmax(Q·Kᵀ / √d) → add up to 1</text><text x="36" y="376" font-size="13" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">New &quot;it&quot;:</text><text x="190" y="376" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Σ weight × Value  (a context-aware vector)</text><g transform="rotate(-1.2 170.0 480.0)"><text x="32" y="444" font-size="12" fill="#2b2b2b" font-weight="bold">Multi-head</text><text x="32" y="465" font-size="12" fill="#2b2b2b">many heads in parallel: one tracks</text><text x="32" y="486" font-size="12" fill="#2b2b2b">grammar, one tracks &quot;who is it?&quot;,</text><text x="32" y="507" font-size="12" fill="#2b2b2b">one tracks position, ...</text></g><g transform="rotate(1.2 497.5 480.0)"><text x="357" y="444" font-size="12" fill="#2b2b2b" font-weight="bold">Cost</text><text x="357" y="465" font-size="12" fill="#2b2b2b">every token × every earlier token</text><text x="357" y="486" font-size="12" fill="#2b2b2b">= n² pairs per layer → long context</text><text x="357" y="507" font-size="12" fill="#2b2b2b">is expensive (FlashAttention, GQA)</text></g><text x="835.0" y="82" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Tokens + positions</text><text x="976" y="146" font-size="12" fill="#6b7280" text-anchor="end" font-weight="bold" style="">× N layers</text><text x="835.0" y="178" font-size="13" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Masked multi-head attention</text><text x="835.0" y="206" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">tokens share information</text><text x="835.0" y="260" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" style="">Add &amp; norm</text><text x="835.0" y="314" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Feed-forward network</text><text x="835.0" y="342" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">each token on its own</text><text x="835.0" y="359" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">much of the &quot;knowledge&quot;</text><text x="835.0" y="400" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" style="">Add &amp; norm</text><text x="835.0" y="470" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Next-token probabilities</text><text x="835.0" y="498" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">after the last layer</text></svg>
