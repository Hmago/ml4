<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="MongoDB write path: cache, journal, checkpoint, oplog, replication"><defs><filter id="md1-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="md1-head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f5fbf"/></marker><marker id="md1-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="md1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="md1-head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c55a11"/></marker><marker id="md1-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker></defs><rect width="1000" height="500" fill="#fbfbf6"/><g filter="url(#md1-rough)"><rect x="20" y="86" width="140" height="84" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="117" x2="154" y2="117" stroke="#2b2b2b" stroke-width="1.2"/><rect x="190" y="56" width="470" height="300" rx="10" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="8 6"/><rect x="210" y="96" width="220" height="104" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="216" y1="127" x2="424" y2="127" stroke="#0b7a4b" stroke-width="1.2"/><rect x="450" y="96" width="190" height="104" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="456" y1="127" x2="634" y2="127" stroke="#6f42c1" stroke-width="1.2"/><rect x="210" y="236" width="220" height="84" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="216" y1="267" x2="424" y2="267" stroke="#c55a11" stroke-width="1.2"/><rect x="450" y="236" width="190" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="456" y1="267" x2="634" y2="267" stroke="#1f5fbf" stroke-width="1.2"/><path d="M160,128 L210,128" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#md1-head-ink)"/><path d="M430,148 L450,148" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#md1-head-purple)"/><path d="M320,200 L320,236" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#md1-head-orange)"/><path d="M400,200 L500,236" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#md1-head-blue)"/><rect x="700" y="70" width="280" height="84" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="706" y1="101" x2="974" y2="101" stroke="#6f42c1" stroke-width="1.2"/><path d="M640,148 L700,112" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#md1-head-purple)"/><rect x="700" y="180" width="280" height="84" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="706" y1="211" x2="974" y2="211" stroke="#6f42c1" stroke-width="1.2"/><path d="M640,148 L700,222" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#md1-head-purple)"/><rect x="700" y="290" width="280" height="66" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="706" y1="321" x2="974" y2="321" stroke="#0b7a4b" stroke-width="1.2"/><path d="M840,264 L840,290" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#md1-head-green)"/><g transform="rotate(0.3 500.0 430.0)"><rect x="23" y="384" width="960" height="100" fill="#00000014"/><rect x="20" y="380" width="960" height="100" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">MongoDB write path: cache, journal, checkpoint, oplog, replication</text><text x="90.0" y="108" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Client</text><text x="90.0" y="136" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">insertOne</text><text x="90.0" y="155" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">w: &quot;majority&quot;</text><text x="204" y="84" font-size="15" fill="#0b7a4b" text-anchor="start" font-weight="bold" style="">Primary (mongod + WiredTiger)</text><text x="320.0" y="118" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">WiredTiger cache</text><text x="320.0" y="146" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">in-memory B-trees</text><text x="320.0" y="165" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">MVCC: each read sees</text><text x="320.0" y="184" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">a snapshot</text><text x="545.0" y="118" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Oplog entry</text><text x="545.0" y="146" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">same write, as an</text><text x="545.0" y="165" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">idempotent op</text><text x="545.0" y="184" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(capped collection)</text><text x="320.0" y="258" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Journal (WAL)</text><text x="320.0" y="286" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">on disk, synced</text><text x="320.0" y="305" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">about every 100 ms</text><text x="545.0" y="258" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Data files</text><text x="545.0" y="286" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">checkpoint every</text><text x="545.0" y="305" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">60 s (a snapshot)</text><text x="440.0" y="142.0" font-size="10" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">same txn</text><text x="458.0" y="222.0" font-size="10" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">checkpoint</text><text x="840.0" y="92" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Secondary 1</text><text x="840.0" y="120" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">pulls the oplog,</text><text x="840.0" y="139" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">applies it in batches</text><text x="670.0" y="123.0" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">pull</text><text x="840.0" y="202" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Secondary 2</text><text x="840.0" y="230" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">pulls the oplog,</text><text x="840.0" y="249" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">applies it in batches</text><text x="840.0" y="312" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Majority has it</text><text x="840.0" y="340" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">2 of 3 → ack to the client</text><g transform="rotate(0.3 500.0 430.0)"><text x="32" y="404" font-size="12" fill="#2b2b2b" font-weight="bold">Why it&#x27;s safe and fast</text><text x="32" y="424" font-size="12" fill="#2b2b2b">crash → restart from the last checkpoint + replay the journal → no journaled write lost</text><text x="32" y="444" font-size="12" fill="#2b2b2b">readers don&#x27;t block writers: every operation reads its own MVCC snapshot</text><text x="32" y="464" font-size="12" fill="#2b2b2b">document-level concurrency: two writes to different documents run in parallel</text></g></svg>
