text-anchor="start" font-weight="bold" style="">L9 · EvalHarness: dataset → run → score → report → CI gate</text><text x="105.0" y="98" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Dataset</text><text x="105.0" y="120" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">cases + tags</text><text x="105.0" y="139" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(versioned)</text><text x="315.0" y="88" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Runner</text><text x="315.0" y="116" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">thread pool</text><text x="315.0" y="133" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">one error = one</text><text x="315.0" y="150" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">failed case</text><text x="315.0" y="232" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">System under test</text><text x="315.0" y="260" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">prompt + model + tools</text><text x="540.0" y="88" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Scorers (Strategy)</text><text x="450" y="116" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">exact match</text><text x="450" y="135" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">contains-all facts</text><text x="450" y="154" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">LLM judge (rubric)</text><text x="750.0" y="88" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Report</text><text x="750.0" y="116" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">pass rate</text><text x="750.0" y="135" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">pass rate by tag</text><text x="750.0" y="154" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">latency</text><text x="912" y="111" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">new</text><text x="912" y="129" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">failures?</text><text x="905.0" y="242" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Block the change</text><text x="905.0" y="270" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">in CI</text><text x="720.0" y="242" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Ship it</text><text x="720.0" y="270" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">baseline = this run</text><text x="920.0" y="196.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="836.0" y="178.4" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">no</text><text x="36" y="336" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Example</text><text x="36" y="360" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">baseline: q1 ✓ · q2 ✓ · q3 ✓ · q4 ✗        |        candidate prompt: q1 ✓ · q2 ✓ · q3 ✗ · q4 ✗</text><text x="36" y="384" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">pass rate 75% → 50%; regression list = [q3] → block. Slices: geo 50%, math 50%.</text></svg>
