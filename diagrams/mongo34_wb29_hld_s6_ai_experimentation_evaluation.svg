th="180" height="160" fill="#00000014"/><rect x="800" y="230" width="180" height="160" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">HLD S6: AI experimentation + evaluation platform</text><text x="115.0" y="102" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Dataset registry</text><text x="115.0" y="124" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">versioned eval sets</text><text x="115.0" y="143" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">from real cases</text><text x="345.0" y="92" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Experiment config</text><text x="345.0" y="120" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">model · prompt · tools</text><text x="345.0" y="137" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">params · seed</text><text x="345.0" y="154" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(stored as code)</text><text x="590.0" y="77" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Runner</text><text x="490" y="105" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">parallel calls</text><text x="490" y="124" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">retries · rate limits</text><text x="490" y="143" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">response cache</text><text x="490" y="162" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">cost + latency tracking</text><text x="870.0" y="97" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">System under test</text><text x="870.0" y="125" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">prompt + model + tools</text><text x="870.0" y="142" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(via L1 LLM client)</text><text x="730.0" y="115.0" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">run case</text><text x="590.0" y="272" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Scorers</text><text x="490" y="300" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">programmatic checks</text><text x="490" y="319" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">LLM-as-judge (rubric)</text><text x="490" y="338" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">human review queue</text><text x="345.0" y="287" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Results store</text><text x="345.0" y="309" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">MongoDB: runs ·</text><text x="345.0" y="328" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">cases · scores</text><text x="115.0" y="277" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Compare dashboard</text><text x="115.0" y="305" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">by slice (tag)</text><text x="115.0" y="322" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">cost · latency</text><text x="115.0" y="339" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">regressions</text><text x="598.0" y="224.0" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">outputs</text><text x="230.0" y="442" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">CI gate</text><text x="230.0" y="470" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">prompt / model change → run evals → block if regressions</text><g transform="rotate(1 625.0 462.5)"><text x="492" y="424" font-size="12" fill="#2b2b2b" font-weight="bold">Every experiment ends with</text><text x="492" y="446" font-size="12" fill="#2b2b2b">hypothesis → results</text><text x="492" y="468" font-size="12" fill="#2b2b2b">decision: kill / iterate / hand off</text><text x="492" y="490" font-size="12" fill="#2b2b2b">owner + next step</text></g><g transform="rotate(-1.5 890.0 310.0)"><text x="812" y="254" font-size="12" fill="#2b2b2b" font-weight="bold">Principles</text><text x="812" y="278" font-size="12" fill="#2b2b2b">fixed, versioned sets</text><text x="812" y="302" font-size="12" fill="#2b2b2b">same seed + temp</text><text x="812" y="326" font-size="12" fill="#2b2b2b">$ next to quality</text><text x="812" y="350" font-size="12" fill="#2b2b2b">slices beat averages</text></g></svg>
