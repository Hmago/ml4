-end="url(#ag3-head-orange)"/><rect x="366" y="316" width="400" height="62" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="372" y1="347" x2="760" y2="347" stroke="#0b7a4b" stroke-width="1.2"/><rect x="810" y="76" width="170" height="104" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="816" y1="107" x2="974" y2="107" stroke="#c0392b" stroke-width="1.2"/><rect x="810" y="296" width="170" height="84" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="816" y1="327" x2="974" y2="327" stroke="#0b7a4b" stroke-width="1.2"/><path d="M766,340 L810,340" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#ag3-head-green)"/><path d="M766,326 L790,326 L790,150 L810,150" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag3-head-red)"/><path d="M420,430 V506 A150.0,12 0 0 0 720,506 V430" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><ellipse cx="570.0" cy="430" rx="150.0" ry="12" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><path d="M566,378 L566,418" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag3-head-green)"/><rect x="780" y="426" width="200" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="786" y1="457" x2="974" y2="457" stroke="#1f5fbf" stroke-width="1.2"/><path d="M895,380 L895,426" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#ag3-head-blue)"/><path d="M780,468 L720,468" fill="none" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag3-head-blue)"/><g transform="rotate(-1.0 175.0 310.0)"><rect x="23" y="214" width="310" height="200" fill="#00000014"/><rect x="20" y="210" width="310" height="200" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">HLD: PR review agent</text><text x="95.0" y="98" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Git host</text><text x="95.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">PR opened /</text><text x="95.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">new commit</text><text x="95.0" y="164" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(webhook)</text><text x="260.0" y="108" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Queue</text><text x="260.0" y="136" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">key = PR +</text><text x="260.0" y="155" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">commit SHA</text><text x="364" y="84" font-size="15" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">Review orchestrator</text><text x="462.0" y="118" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">1 Gather context</text><text x="462.0" y="146" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">diff + PR text</text><text x="462.0" y="165" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">repo review rules</text><text x="462.0" y="184" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">CODEOWNERS · file history</text><text x="670.0" y="118" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">2 Triage (code)</text><text x="670.0" y="146" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">skip lockfiles, generated</text><text x="670.0" y="165" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">risk: auth? payments?</text><text x="670.0" y="184" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">big PR → per file</text><text x="431.0" y="250" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">3a Correctness</text><text x="431.0" y="278" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">LLM pass</text><text x="568.0" y="250" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">3b Security</text><text x="568.0" y="278" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">LLM + SAST</text><text x="703.0" y="250" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">3c Tests</text><text x="703.0" y="278" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">LLM pass</text><text x="566.0" y="338" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">4 Filter + rank (plain code)</text><text x="566.0" y="366" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">on a changed line? · confidence ≥ 0.7 · dedupe · max 10</text><text x="895.0" y="98" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Human gate</text><text x="895.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">risky path or a</text><text x="895.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">blocking finding →</text><text x="895.0" y="164" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">ask the code owner</text><text x="895.0" y="318" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">5 Post to PR</text><text x="895.0" y="346" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">inline comments</text><text x="895.0" y="365" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ one summary</text><text x="796.0" y="231.0" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">risky</text><text x="570.0" y="460" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">MongoDB</text><text x="570.0" y="482" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">runs · findings (by PR, SHA)</text><text x="570.0" y="501" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">feedback · metrics</text><text x="572.0" y="418.0" font-size="11" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">store</text><text x="880.0" y="448" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Developer feedback</text><text x="880.0" y="476" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">👍/👎 · fixed or ignored?</text><text x="880.0" y="495" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">→ evals + rule tuning</text><g transform="rotate(-1.0 175.0 310.0)"><text x="32" y="234" font-size="12" fill="#2b2b2b" font-weight="bold">Rules that make it trusted</text><text x="32" y="258" font-size="12" fill="#2b2b2b">precision &gt; recall (few, right comments)</text><text x="32" y="282" font-size="12" fill="#2b2b2b">comment only on changed lines</text><text x="32" y="306" font-size="12" fill="#2b2b2b">PR text = untrusted input</text><text x="32" y="330" font-size="12" fill="#2b2b2b">LLM has NO write tools; code posts</text><text x="32" y="354" font-size="12" fill="#2b2b2b">&quot;no issues&quot; is a valid answer</text><text x="32" y="378" font-size="12" fill="#2b2b2b">re-run on new commit: no repeats</text></g></svg>
