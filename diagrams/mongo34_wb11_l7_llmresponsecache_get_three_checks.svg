checks before calling the model</text><text x="105.0" y="92" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">get(...)</text><text x="105.0" y="120" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">scope · model ·</text><text x="105.0" y="136" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">temperature · prompt</text><text x="300" y="103" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">temperature</text><text x="300" y="121" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">too high?</text><text x="520" y="103" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">exact hit?</text><text x="520" y="121" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">SHA-256 key</text><text x="750" y="103" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">similar hit?</text><text x="750" y="121" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">cosine ≥ 0.9</text><text x="925.0" y="182" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Miss</text><text x="925.0" y="210" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">call LLM</text><text x="925.0" y="226" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">→ put()</text><text x="925.0" y="242" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">→ return</text><text x="407.5" y="101.0" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">no</text><text x="632.5" y="101.0" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">no</text><text x="869.0" y="101.0" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">no</text><text x="300.0" y="222" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Skip the cache</text><text x="300.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">creative output varies</text><text x="520.0" y="222" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Return cached</text><text x="520.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">same prompt</text><text x="750.0" y="222" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Return cached</text><text x="750.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">similar prompt</text><text x="308.0" y="182.0" font-size="12" fill="#c55a11" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="528.0" y="182.0" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="758.0" y="182.0" font-size="12" fill="#6f42c1" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="20" y="300" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Exact key = SHA-256(scope | model | temperature | prompt)    Similar = embeddings compared only within the same scope + model</text><g transform="rotate(-0.8 255.0 361.0)"><text x="32" y="342" font-size="12" fill="#2b2b2b" font-weight="bold">Why scope is in every key</text><text x="32" y="363" font-size="12" fill="#2b2b2b">one tenant&#x27;s cached answer can never be served to</text><text x="32" y="384" font-size="12" fill="#2b2b2b">another tenant</text></g><g transform="rotate(0.8 745.0 361.0)"><text x="522" y="342" font-size="12" fill="#2b2b2b" font-weight="bold">Risk</text><text x="522" y="363" font-size="12" fill="#2b2b2b">&quot;cancel order 123&quot; ≈ &quot;cancel order 124&quot;: keep the</text><text x="522" y="384" font-size="12" fill="#2b2b2b">threshold high · TTL · measure false hits</text></g></svg>
