<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="Containers and Kubernetes in one picture"><defs><filter id="sd2-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="sd2-head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f5fbf"/></marker><marker id="sd2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="sd2-head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c55a11"/></marker><marker id="sd2-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker></defs><rect width="1000" height="520" fill="#fbfbf6"/><g filter="url(#sd2-rough)"><rect x="20" y="90" width="110" height="66" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="121" x2="124" y2="121" stroke="#2b2b2b" stroke-width="1.2"/><rect x="160" y="80" width="150" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="166" y1="111" x2="304" y2="111" stroke="#1f5fbf" stroke-width="1.2"/><rect x="340" y="80" width="150" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="346" y1="111" x2="484" y2="111" stroke="#1f5fbf" stroke-width="1.2"/><path d="M130,122 L160,122" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd2-head-ink)"/><path d="M310,122 L340,122" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#sd2-head-blue)"/><rect x="520" y="56" width="460" height="236" rx="10" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="8 6"/><rect x="540" y="100" width="130" height="84" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="546" y1="131" x2="664" y2="131" stroke="#0b7a4b" stroke-width="1.2"/><rect x="685" y="100" width="130" height="84" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="691" y1="131" x2="809" y2="131" stroke="#0b7a4b" stroke-width="1.2"/><rect x="830" y="100" width="130" height="84" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="836" y1="131" x2="954" y2="131" stroke="#0b7a4b" stroke-width="1.2"/><path d="M490,122 L540,142" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#sd2-head-blue)"/><rect x="20" y="330" width="230" height="84" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="26" y1="361" x2="244" y2="361" stroke="#c55a11" stroke-width="1.2"/><rect x="265" y="330" width="230" height="84" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="271" y1="361" x2="489" y2="361" stroke="#6f42c1" stroke-width="1.2"/><rect x="510" y="330" width="230" height="84" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="516" y1="361" x2="734" y2="361" stroke="#c0392b" stroke-width="1.2"/><rect x="755" y="330" width="230" height="84" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="761" y1="361" x2="979" y2="361" stroke="#2b2b2b" stroke-width="1.2"/><path d="M135,330 L135,300 L560,300 L560,292" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#sd2-head-orange)"/><path d="M380,330 L380,310 L700,310 L700,292" fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#sd2-head-purple)"/><g transform="rotate(0.3 500.0 470.0)"><rect x="23" y="438" width="960" height="72" fill="#00000014"/><rect x="20" y="434" width="960" height="72" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Containers and Kubernetes in one picture</text><text x="75.0" y="112" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Users</text><text x="75.0" y="140" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">HTTPS</text><text x="235.0" y="102" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Ingress</text><text x="235.0" y="130" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">routes /api → svc</text><text x="235.0" y="149" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">TLS</text><text x="415.0" y="102" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Service</text><text x="415.0" y="130" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">stable name + IP</text><text x="415.0" y="149" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">load-balances pods</text><text x="534" y="84" font-size="15" fill="#0b7a4b" text-anchor="start" font-weight="bold" style="">Deployment: api  (replicas: 3)</text><text x="605.0" y="122" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Pod 1</text><text x="605.0" y="150" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">container</text><text x="605.0" y="169" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">image app:1.4</text><text x="750.0" y="122" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Pod 2</text><text x="750.0" y="150" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">container</text><text x="750.0" y="169" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">image app:1.4</text><text x="895.0" y="122" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Pod 3</text><text x="895.0" y="150" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">container</text><text x="895.0" y="169" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">image app:1.4</text><text x="750" y="222" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="">a ReplicaSet keeps 3 pods running;</text><text x="750" y="244" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="">a rolling update swaps them one by one</text><text x="750" y="270" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic" style="">(zero downtime, easy rollback)</text><text x="135.0" y="352" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">ConfigMap / Secret</text><text x="135.0" y="380" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">config + passwords</text><text x="135.0" y="399" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">mounted into pods</text><text x="380.0" y="352" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">HPA (autoscaler)</text><text x="380.0" y="380" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">3 → 10 pods on</text><text x="380.0" y="399" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">CPU or queue length</text><text x="625.0" y="352" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Probes</text><text x="625.0" y="380" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">liveness: restart if stuck</text><text x="625.0" y="399" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">readiness: wait for ready</text><text x="870.0" y="352" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Nodes</text><text x="870.0" y="380" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">VMs that run the pods</text><text x="870.0" y="399" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(GPU pool for models)</text><g transform="rotate(0.3 500.0 470.0)"><text x="32" y="458" font-size="12" fill="#2b2b2b" font-weight="bold">Container = your app + everything it needs, in one image (Docker). Same image in dev, test, prod.</text><text x="32" y="480" font-size="12" fill="#2b2b2b">Kubernetes = runs many containers for you: restarts them, scales them, rolls out new versions.</text></g></svg>
