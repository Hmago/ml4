<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="How an LLM answers: tokens in → ONE token out → repeat"><defs><filter id="ai1-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="ai1-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="ai1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="ai1-head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c55a11"/></marker><marker id="ai1-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c0392b"/></marker></defs><rect width="1000" height="500" fill="#fbfbf6"/><g filter="url(#ai1-rough)"><rect x="20" y="90" width="150" height="100" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="121" x2="164" y2="121" stroke="#2b2b2b" stroke-width="1.2"/><rect x="200" y="90" width="160" height="100" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="206" y1="121" x2="354" y2="121" stroke="#1f5fbf" stroke-width="1.2"/><rect x="390" y="90" width="160" height="100" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="396" y1="121" x2="544" y2="121" stroke="#6f42c1" stroke-width="1.2"/><rect x="580" y="70" width="200" height="150" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="586" y1="101" x2="774" y2="101" stroke="#0b7a4b" stroke-width="1.2"/><rect x="810" y="70" width="170" height="150" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><rect x="885" y="112" width="53.3" height="16" rx="3" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.2"/><rect x="885" y="137" width="28.6" height="16" rx="3" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.2"/><rect x="885" y="162" width="15.6" height="16" rx="3" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.2"/><rect x="885" y="187" width="6.5" height="16" rx="3" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.2"/><path d="M170,140 L200,140" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai1-head-ink)"/><path d="M360,140 L390,140" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai1-head-ink)"/><path d="M550,140 L580,140" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai1-head-ink)"/><path d="M780,140 L810,140" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai1-head-ink)"/><rect x="810" y="265" width="170" height="80" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="816" y1="296" x2="974" y2="296" stroke="#c55a11" stroke-width="1.2"/><path d="M895,220 L895,265" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ai1-head-red)"/><rect x="580" y="265" width="200" height="80" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="586" y1="296" x2="774" y2="296" stroke="#2b2b2b" stroke-width="1.2"/><path d="M810,305 L780,305" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#ai1-head-orange)"/><path d="M680,265 L680,220" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#ai1-head-green)"/><rect x="390" y="265" width="160" height="80" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="396" y1="296" x2="544" y2="296" stroke="#c0392b" stroke-width="1.2"/><path d="M550,280 L600,222" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai1-head-red)"/><g transform="rotate(-1.5 185.0 295.0)"><rect x="23" y="234" width="330" height="130" fill="#00000014"/><rect x="20" y="230" width="330" height="130" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g><rect x="20" y="390" width="460" height="85" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="26" y1="421" x2="474" y2="421" stroke="#1f5fbf" stroke-width="1.2"/><rect x="510" y="390" width="470" height="85" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="516" y1="421" x2="974" y2="421" stroke="#c55a11" stroke-width="1.2"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">How an LLM answers: tokens in → ONE token out → repeat</text><text x="95.0" y="112" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Your prompt</text><text x="95.0" y="140" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">&quot;Why is checkout</text><text x="95.0" y="158" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">slow today?&quot;</text><text x="280.0" y="112" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Tokenizer</text><text x="280.0" y="140" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Why | is | check</text><text x="280.0" y="158" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">out | slow | ...</text><text x="470.0" y="112" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Embeddings</text><text x="470.0" y="140" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">token → vector</text><text x="470.0" y="158" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ position</text><text x="680.0" y="92" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Transformer × N</text><text x="680.0" y="120" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">self-attention: each</text><text x="680.0" y="139" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">token looks at the</text><text x="680.0" y="158" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">earlier tokens</text><text x="680.0" y="177" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ feed-forward</text><text x="895.0" y="92" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Next-token odds</text><text x="822" y="125" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">because</text><text x="944.3" y="125" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" style="">0.41</text><text x="822" y="150" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">the</text><text x="919.6" y="150" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" style="">0.22</text><text x="822" y="175" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">traffic</text><text x="906.6" y="175" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" style="">0.12</text><text x="822" y="200" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">…</text><text x="897.5" y="200" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" style="">0.05</text><text x="895.0" y="287" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Sampling</text><text x="895.0" y="315" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">temperature · top-p</text><text x="680.0" y="287" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Append token</text><text x="680.0" y="315" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">&quot;because&quot; → context</text><text x="688.0" y="246.5" font-size="12" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">repeat until stop</text><text x="470.0" y="287" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">KV cache</text><text x="470.0" y="315" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">reuse past keys</text><text x="470.0" y="332" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ values</text><g transform="rotate(-1.5 185.0 295.0)"><text x="32" y="254" font-size="12" fill="#2b2b2b" font-weight="bold">Remember</text><text x="32" y="275" font-size="12" fill="#2b2b2b">stateless: you resend the history</text><text x="32" y="296" font-size="12" fill="#2b2b2b">window = input + output tokens</text><text x="32" y="317" font-size="12" fill="#2b2b2b">cost = input + output tokens</text><text x="32" y="338" font-size="12" fill="#2b2b2b">temperature 0 ≈ focused, not guaranteed</text></g><text x="250.0" y="412" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Prefill (reading)</text><text x="250.0" y="440" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">whole prompt in parallel → time to first token (TTFT)</text><text x="745.0" y="412" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Decode (writing)</text><text x="745.0" y="440" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">one token at a time → tokens/sec · output tokens cost more</text></svg>
