<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="L5 · Guardrails: a chain of guards on the way in and on the way out"><defs><filter id="l5-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="l5-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="l5-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker></defs><rect width="1000" height="430" fill="#fbfbf6"/><g filter="url(#l5-rough)"><rect x="20" y="60" width="120" height="80" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="91" x2="134" y2="91" stroke="#2b2b2b" stroke-width="1.2"/><rect x="170" y="60" width="170" height="80" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="176" y1="91" x2="334" y2="91" stroke="#c0392b" stroke-width="1.2"/><rect x="370" y="60" width="170" height="80" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="376" y1="91" x2="534" y2="91" stroke="#c0392b" stroke-width="1.2"/><rect x="570" y="60" width="170" height="80" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="576" y1="91" x2="734" y2="91" stroke="#c55a11" stroke-width="1.2"/><rect x="770" y="60" width="210" height="80" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="776" y1="91" x2="974" y2="91" stroke="#6f42c1" stroke-width="1.2"/><path d="M140,100 L170,100" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l5-head-ink)"/><path d="M340,100 L370,100" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l5-head-ink)"/><path d="M540,100 L570,100" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l5-head-ink)"/><path d="M740,100 L770,100" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l5-head-ink)"/><rect x="770" y="200" width="210" height="80" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="776" y1="231" x2="974" y2="231" stroke="#6f42c1" stroke-width="1.2"/><path d="M875,140 L875,200" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#l5-head-purple)"/><rect x="570" y="200" width="170" height="80" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="576" y1="231" x2="734" y2="231" stroke="#c0392b" stroke-width="1.2"/><rect x="370" y="200" width="170" height="80" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="376" y1="231" x2="534" y2="231" stroke="#c55a11" stroke-width="1.2"/><rect x="170" y="200" width="170" height="80" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="176" y1="231" x2="334" y2="231" stroke="#c55a11" stroke-width="1.2"/><rect x="20" y="200" width="120" height="80" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="231" x2="134" y2="231" stroke="#2b2b2b" stroke-width="1.2"/><path d="M770,240 L740,240" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l5-head-ink)"/><path d="M570,240 L540,240" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l5-head-ink)"/><path d="M370,240 L340,240" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l5-head-ink)"/><path d="M170,240 L140,240" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l5-head-ink)"/><rect x="20" y="310" width="960" height="50" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">L5 · Guardrails: a chain of guards on the way in and on the way out</text><text x="80.0" y="82" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">User input</text><text x="80.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">&quot;mail a@b.com&quot;</text><text x="255.0" y="82" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">MaxLength</text><text x="255.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">BLOCK if &gt; 8,000 chars</text><text x="455.0" y="82" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">InjectionHeuristic</text><text x="455.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">BLOCK &quot;ignore previous…&quot;</text><text x="655.0" y="82" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">PiiRedactor</text><text x="655.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">MODIFY → [EMAIL]</text><text x="875.0" y="82" font-size="13" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="875.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">gets the cleaned text</text><text x="875.0" y="222" font-size="13" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LLM output</text><text x="875.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">the raw answer</text><text x="655.0" y="222" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">SecretLeak</text><text x="655.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">BLOCK if it looks like a key</text><text x="455.0" y="222" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">PiiRedactor</text><text x="455.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">MODIFY: redact PII</text><text x="255.0" y="222" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">LinkAllowList</text><text x="255.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">MODIFY: drop bad links</text><text x="80.0" y="222" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">User</text><text x="80.0" y="250" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">safe answer</text><text x="36" y="341" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Each guard returns:</text><text x="200" y="341" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="">ALLOW → pass on</text><text x="370" y="341" font-size="13" fill="#c55a11" text-anchor="start" font-weight="normal" style="">MODIFY → pass the changed text on</text><text x="680" y="341" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal" style="">BLOCK → stop the chain + log it</text><text x="20" y="395" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">Cheap checks and blockers first, rewriters after · add a classifier model as another guard · log every block for audit</text></svg>
