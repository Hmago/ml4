roke-width="1.8"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">HLD S8: sharded cluster + choosing a shard key (avoid hot shards)</text><text x="75.0" y="117" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">App</text><text x="75.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">driver</text><text x="245.0" y="102" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">mongos</text><text x="245.0" y="130" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">routers (×N)</text><text x="245.0" y="147" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">route by shard key</text><text x="445.0" y="114" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Config servers</text><text x="445.0" y="136" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">replica set</text><text x="445.0" y="155" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">chunk → shard map</text><text x="650.0" y="102" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Shard A</text><text x="650.0" y="130" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">replica set</text><text x="650.0" y="147" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">key ranges</text><text x="780.0" y="102" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Shard B</text><text x="780.0" y="130" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">replica set</text><text x="780.0" y="147" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">key ranges</text><text x="910.0" y="102" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Shard 