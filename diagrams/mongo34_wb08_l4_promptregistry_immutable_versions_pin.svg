<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="L4 · PromptRegistry: immutable versions, pin, A/B, strict render"><defs><filter id="l4-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="l4-head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f5fbf"/></marker><marker id="l4-head-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6b7280"/></marker><marker id="l4-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker></defs><rect width="1000" height="420" fill="#fbfbf6"/><g filter="url(#l4-rough)"><rect x="20" y="120" width="150" height="60" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="151" x2="164" y2="151" stroke="#2b2b2b" stroke-width="1.2"/><rect x="220" y="56" width="360" height="54" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><path d="M170,150 L220,83" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#l4-head-gray)"/><rect x="220" y="126" width="360" height="54" rx="8" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><path d="M170,150 L220,153" fill="none" stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#l4-head-blue)"/><rect x="220" y="196" width="360" height="54" rx="8" fill="#ffffff" stroke="#6f42c1" stroke-width="2"/><path d="M170,150 L220,223" fill="none" stroke="#6f42c1" stroke-width="1.6" marker-end="url(#l4-head-purple)"/><rect x="640" y="56" width="340" height="64" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="646" y1="87" x2="974" y2="87" stroke="#1f5fbf" stroke-width="1.2"/><path d="M640,100 L580,140" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#l4-head-blue)"/><rect x="640" y="140" width="340" height="104" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="646" y1="171" x2="974" y2="171" stroke="#6f42c1" stroke-width="1.2"/><path d="M640,210 L580,210" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#l4-head-purple)"/><rect x="20" y="290" width="560" height="112" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="26" y1="321" x2="574" y2="321" stroke="#c0392b" stroke-width="1.2"/><g transform="rotate(1 810.0 341.0)"><rect x="643" y="286" width="340" height="118" fill="#00000014"/><rect x="640" y="282" width="340" height="118" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">L4 · PromptRegistry: immutable versions, pin, A/B, strict render</text><text x="95.0" y="142" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">&quot;summarize&quot;</text><text x="95.0" y="170" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">prompt name</text><text x="236" y="78" font-size="14" fill="#6b7280" text-anchor="start" font-weight="bold" style="">v1</text><text x="236" y="98" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Summarize {{doc}} for {{audience}}.</text><text x="236" y="148" font-size="14" fill="#1f5fbf" text-anchor="start" font-weight="bold" style="">v2</text><text x="236" y="168" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Summarize {{doc}} in 3 bullets for {{audience}}.</text><text x="236" y="218" font-size="14" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">v3</text><text x="236" y="238" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">You are concise. Summarize {{doc}} … (new)</text><text x="590" y="260" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">versions never change; a fix = a new version</text><text x="810.0" y="78" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">pin(&quot;summarize&quot;, 2)</text><text x="810.0" y="106" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">production uses v2 · rollback = re-pin</text><text x="610.0" y="116.0" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">pinned</text><text x="810.0" y="162" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">A/B: forUser(user, A=v2, B=v3, 20%)</text><text x="650" y="190" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">hash(name:user) % 100 &lt; 20 → v3</text><text x="650" y="209" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">else → v2</text><text x="650" y="228" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">same user always gets the same one</text><text x="300.0" y="312" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">render(values)</text><text x="30" y="340" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">missing variable  → error   (catches typos)</text><text x="30" y="360" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">unknown variable  → error</text><text x="30" y="380" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">single pass: user text containing {{x}} is NOT expanded again</text><g transform="rotate(1 810.0 341.0)"><text x="652" y="306" font-size="12" fill="#2b2b2b" font-weight="bold">Say this</text><text x="652" y="327" font-size="12" fill="#2b2b2b">stable text first, variables last</text><text x="652" y="348" font-size="12" fill="#2b2b2b">(prompt caching)</text><text x="652" y="369" font-size="12" fill="#2b2b2b">gate pin() on an eval run (L9)</text></g></svg>
