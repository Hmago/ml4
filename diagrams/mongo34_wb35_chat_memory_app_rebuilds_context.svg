<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="Chat memory: the app rebuilds the context window on every call"><defs><filter id="ai4-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="ai4-head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f5fbf"/></marker><marker id="ai4-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="ai4-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="ai4-head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c55a11"/></marker><marker id="ai4-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker><marker id="ai4-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c0392b"/></marker></defs><rect width="1000" height="575" fill="#fbfbf6"/><g filter="url(#ai4-rough)"><rect x="20" y="56" width="120" height="78" rx="4" fill="#f1ebfb" stroke="#6f42c1" stroke-width="1.8"/><rect x="140" y="56" width="130" height="78" rx="4" fill="#e3f4ea" stroke="#0b7a4b" stroke-width="1.8"/><rect x="270" y="56" width="170" height="78" rx="4" fill="#fbeadf" stroke="#c55a11" stroke-width="1.8"/><rect x="440" y="56" width="170" height="78" rx="4" fill="#e5eefb" stroke="#1f5fbf" stroke-width="1.8"/><rect x="610" y="56" width="230" height="78" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/><rect x="840" y="56" width="140" height="78" rx="4" fill="#ececec" stroke="#6b7280" stroke-width="1.8"/><rect x="20" y="200" width="130" height="72" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="231" x2="144" y2="231" stroke="#2b2b2b" stroke-width="1.2"/><rect x="180" y="200" width="160" height="72" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="186" y1="231" x2="334" y2="231" stroke="#1f5fbf" stroke-width="1.2"/><polygon points="450,188.0 530.0,236 450,284.0 370.0,236" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><rect x="580" y="200" width="180" height="72" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="586" y1="231" x2="754" y2="231" stroke="#6f42c1" stroke-width="1.2"/><rect x="800" y="200" width="180" height="72" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="806" y1="231" x2="974" y2="231" stroke="#0b7a4b" stroke-width="1.2"/><rect x="370" y="330" width="160" height="92" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="376" y1="361" x2="524" y2="361" stroke="#c55a11" stroke-width="1.2"/><path d="M580,412 V513 A115.0,12 0 0 0 810,513 V412" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><ellipse cx="695.0" cy="412" rx="115.0" ry="12" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><path d="M150,236 L180,236" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai4-head-ink)"/><path d="M340,236 L370,236" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#ai4-head-blue)"/><path d="M530,236 L580,236" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ai4-head-red)"/><path d="M450,284 L450,330" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ai4-head-red)"/><path d="M530,375 L660,375 L660,272" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#ai4-head-orange)"/><path d="M760,236 L800,236" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai4-head-purple)"/><path d="M260,272 L260,470 L580,470" fill="none" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai4-head-blue)"/><path d="M740,400 L740,272" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai4-head-green)"/><g transform="rotate(-1.5 130.0 400.0)"><rect x="23" y="304" width="220" height="200" fill="#00000014"/><rect x="20" y="300" width="220" height="200" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Chat memory: the app rebuilds the context window on every call</text><text x="80.0" y="88" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">System prompt</text><text x="80.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">fixed, cacheable</text><text x="205.0" y="88" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Pinned facts</text><text x="205.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">never dropped</text><text x="355.0" y="88" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Summary</text><text x="355.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">older turns, compressed</text><text x="525.0" y="88" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Retrieved memories</text><text x="525.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">relevant old turns</text><text x="725.0" y="88" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Recent turns</text><text x="725.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">last few, word for word</text><text x="910.0" y="88" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" style="">Answer reserve</text><text x="910.0" y="110" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">max output tokens</text><text x="500" y="156" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic" style="">everything above must fit in the model&#x27;s context window (input + output tokens)</text><text x="85.0" y="222" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">New message</text><text x="85.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">user turn</text><text x="260.0" y="222" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Append</text><text x="260.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ count tokens</text><text x="450" y="231" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Over</text><text x="450" y="249" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">budget?</text><text x="670.0" y="222" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Build context</text><text x="670.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">the 6 parts above</text><text x="890.0" y="222" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="890.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">reply is appended too</text><text x="450.0" y="352" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Evict + summarize</text><text x="450.0" y="380" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">oldest unpinned turns</text><text x="450.0" y="397" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">→ cheap LLM summary</text><text x="450.0" y="414" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(capped size)</text><text x="695.0" y="442" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">MongoDB</text><text x="695.0" y="464" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">full history (never lost)</text><text x="695.0" y="483" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">embeddings of past turns</text><text x="555.0" y="229.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">no</text><text x="458.0" y="311.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="595.0" y="368.0" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">summary updated</text><text x="268.0" y="375.0" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">save every turn</text><text x="748.0" y="340.0" font-size="12" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">top-k similar</text><g transform="rotate(-1.5 130.0 400.0)"><text x="32" y="324" font-size="12" fill="#2b2b2b" font-weight="bold">Strategies</text><text x="32" y="348" font-size="12" fill="#2b2b2b">1 last N turns</text><text x="32" y="372" font-size="12" fill="#2b2b2b">2 token-budget trim</text><text x="32" y="396" font-size="12" fill="#2b2b2b">3 rolling summary</text><text x="32" y="420" font-size="12" fill="#2b2b2b">4 pinned facts</text><text x="32" y="444" font-size="12" fill="#2b2b2b">5 retrieval memory</text><text x="32" y="468" font-size="12" fill="#2b2b2b">6 provider-managed state</text></g><text x="20" y="560" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">The model is stateless: &quot;memory&quot; = what the app puts back into the window. Stable parts first (prompt caching), newest turns last.</text></svg>
