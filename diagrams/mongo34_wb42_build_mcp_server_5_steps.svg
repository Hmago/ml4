<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="Build an MCP server in 5 steps, and what it says on the wire"><defs><filter id="ai10-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="ai10-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="ai10-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="ai10-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker></defs><rect width="1000" height="450" fill="#fbfbf6"/><g filter="url(#ai10-rough)"><rect x="20" y="56" width="380" height="62" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="87" x2="394" y2="87" stroke="#2b2b2b" stroke-width="1.2"/><rect x="20" y="132" width="380" height="62" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="26" y1="163" x2="394" y2="163" stroke="#6f42c1" stroke-width="1.2"/><path d="M210,118 L210,132" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai10-head-ink)"/><rect x="20" y="208" width="380" height="62" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="26" y1="239" x2="394" y2="239" stroke="#0b7a4b" stroke-width="1.2"/><path d="M210,194 L210,208" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai10-head-ink)"/><rect x="20" y="284" width="380" height="62" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="26" y1="315" x2="394" y2="315" stroke="#1f5fbf" stroke-width="1.2"/><path d="M210,270 L210,284" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai10-head-ink)"/><rect x="20" y="360" width="380" height="62" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="26" y1="391" x2="394" y2="391" stroke="#c55a11" stroke-width="1.2"/><path d="M210,346 L210,360" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai10-head-ink)"/><rect x="460" y="56" width="200" height="44" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><rect x="760" y="56" width="200" height="44" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="560" y1="100" x2="560" y2="350" stroke="#6f42c1" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="860" y1="100" x2="860" y2="350" stroke="#0b7a4b" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M560,132 L860,132" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai10-head-purple)"/><path d="M860,162 L560,162" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai10-head-green)"/><path d="M560,202 L860,202" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai10-head-purple)"/><path d="M560,242 L860,242" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai10-head-purple)"/><path d="M860,272 L560,272" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai10-head-green)"/><path d="M560,312 L860,312" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai10-head-purple)"/><path d="M860,342 L560,342" fill="none" stroke="#0b7a4b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ai10-head-green)"/><g transform="rotate(0.6 710.0 398.0)"><rect x="463" y="370" width="500" height="64" fill="#00000014"/><rect x="460" y="366" width="500" height="64" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Build an MCP server in 5 steps, and what it says on the wire</text><text x="210.0" y="78" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">1 Add the SDK</text><text x="210.0" y="106" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">io.modelcontextprotocol.sdk:mcp</text><text x="210.0" y="154" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">2 Describe the tool</text><text x="210.0" y="182" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">name + description + JSON schema</text><text x="210.0" y="230" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">3 Write the handler</text><text x="210.0" y="258" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">args → query → text result</text><text x="210.0" y="306" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">4 Start the server</text><text x="210.0" y="334" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">stdio (local) · Streamable HTTP (remote)</text><text x="210.0" y="382" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">5 Plug in + test</text><text x="210.0" y="410" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">MCP Inspector · VS Code mcp.json</text><text x="560.0" y="78" font-size="13" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">AI app (MCP client)</text><text x="860.0" y="78" font-size="13" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">OrdersMcpServer</text><text x="710.0" y="127.0" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">1 initialize (protocol version)</text><text x="710.0" y="157.0" font-size="11" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">capabilities: tools</text><text x="710.0" y="197.0" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">2 notifications/initialized</text><text x="710.0" y="237.0" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">3 tools/list</text><text x="710.0" y="267.0" font-size="11" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">[ find_orders + schema ]</text><text x="710.0" y="307.0" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">4 tools/call find_orders {status: &quot;failed&quot;}</text><text x="710.0" y="337.0" font-size="11" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">&quot;2 failed orders: A1, A3&quot;</text><g transform="rotate(0.6 710.0 398.0)"><text x="472" y="390" font-size="12" fill="#2b2b2b" font-weight="bold">stdio rule</text><text x="472" y="412" font-size="12" fill="#2b2b2b">stdout carries JSON-RPC, so print logs to stderr only</text></g></svg>
