<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="RAG in Microsoft Copilot agents (example: an IT help agent)"><defs><filter id="ai8-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="ai8-head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#1f5fbf"/></marker><marker id="ai8-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="ai8-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="ai8-head-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6f42c1"/></marker><marker id="ai8-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c0392b"/></marker></defs><rect width="1000" height="565" fill="#fbfbf6"/><g filter="url(#ai8-rough)"><rect x="20" y="52" width="330" height="74" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="83" x2="344" y2="83" stroke="#2b2b2b" stroke-width="1.2"/><path d="M110,126 L110,168" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ai8-head-ink)"/><rect x="20" y="168" width="200" height="118" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="26" y1="199" x2="214" y2="199" stroke="#1f5fbf" stroke-width="1.2"/><rect x="250" y="168" width="262" height="210" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="256" y1="199" x2="506" y2="199" stroke="#0b7a4b" stroke-width="1.2"/><rect x="542" y="168" width="200" height="118" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="548" y1="199" x2="736" y2="199" stroke="#6f42c1" stroke-width="1.2"/><rect x="772" y="168" width="208" height="118" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="778" y1="199" x2="974" y2="199" stroke="#c0392b" stroke-width="1.2"/><path d="M220,227 L250,227" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#ai8-head-blue)"/><path d="M512,227 L542,227" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#ai8-head-green)"/><path d="M742,227 L772,227" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai8-head-purple)"/><path d="M250,422 V526 A131.0,12 0 0 0 512,526 V422" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><ellipse cx="381.0" cy="422" rx="131.0" ry="12" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><path d="M381,378 L381,410" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#ai8-head-green)" marker-start="url(#ai8-head-green)"/><rect x="542" y="312" width="438" height="112" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="548" y1="343" x2="974" y2="343" stroke="#2b2b2b" stroke-width="1.2"/><path d="M876,286 L876,312" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ai8-head-red)"/><g transform="rotate(0.8 761.0 494.0)"><rect x="545" y="450" width="438" height="96" fill="#00000014"/><rect x="542" y="446" width="438" height="96" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g><g transform="rotate(-1.5 120.0 387.0)"><rect x="23" y="316" width="200" height="150" fill="#00000014"/><rect x="20" y="312" width="200" height="150" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">RAG in Microsoft Copilot agents (example: an IT help agent)</text><text x="185.0" y="74" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">User asks</text><text x="185.0" y="102" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">&quot;How do I get a new laptop?&quot;</text><text x="120.0" y="190" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">1 Rewrite query</text><text x="120.0" y="218" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">uses the last 10 turns</text><text x="120.0" y="236" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">→ &quot;laptop request process</text><text x="120.0" y="254" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">hardware policy&quot;</text><text x="381.0" y="190" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">2 Retrieve (in parallel)</text><text x="260" y="218" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">SharePoint / OneDrive</text><text x="260" y="242" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Copilot connectors (ServiceNow…)</text><text x="260" y="266" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Dataverse · Azure AI Search</text><text x="260" y="290" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">public websites (Bing)</text><text x="260" y="314" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">uploaded files</text><text x="260" y="338" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">→ top 3 results per source</text><text x="642.0" y="190" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">3 Summarize</text><text x="642.0" y="218" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">the LLM answers only</text><text x="642.0" y="236" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">from those snippets</text><text x="642.0" y="254" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ adds citations</text><text x="876.0" y="190" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">4 Safety check</text><text x="876.0" y="218" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">moderation checks the</text><text x="876.0" y="236" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">answer before sending</text><text x="381.0" y="452" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Microsoft 365 index</text><text x="381.0" y="474" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">keyword + vector (semantic)</text><text x="381.0" y="493" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">permission-trimmed (Entra ID)</text><text x="761.0" y="334" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Answer</text><text x="552" y="362" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">&quot;Raise a ServiceNow request: Hardware &gt; Laptop.</text><text x="552" y="381" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">Your manager approves it.&quot; [1] [2]</text><text x="552" y="400" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">[1] IT-Hardware-Policy.docx · [2] ServiceNow KB0012</text><g transform="rotate(0.8 761.0 494.0)"><text x="554" y="470" font-size="12" fill="#2b2b2b" font-weight="bold">Custom engine agent?</text><text x="554" y="492" font-size="12" fill="#2b2b2b">call the Copilot Retrieval API → permission-trimmed</text><text x="554" y="514" font-size="12" fill="#2b2b2b">text chunks from the same index → your own LLM</text></g><g transform="rotate(-1.5 120.0 387.0)"><text x="32" y="336" font-size="12" fill="#2b2b2b" font-weight="bold">Security</text><text x="32" y="358" font-size="12" fill="#2b2b2b">a user only gets</text><text x="32" y="380" font-size="12" fill="#2b2b2b">content they can</text><text x="32" y="402" font-size="12" fill="#2b2b2b">already open</text><text x="32" y="424" font-size="12" fill="#2b2b2b">(no new access)</text></g></svg>
