width="100" height="34" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><rect x="250" y="390" width="60" height="34" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><rect x="160" y="340" width="66" height="34" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><path d="M130,407 L160,357" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag2-head-purple)"/><path d="M226,357 L250,407" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag2-head-purple)"/><rect x="160" y="390" width="66" height="34" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><path d="M130,407 L160,407" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag2-head-purple)"/><path d="M226,407 L250,407" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag2-head-purple)"/><rect x="160" y="440" width="66" height="34" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><path d="M130,407 L160,457" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag2-head-purple)"/><path d="M226,457 L250,407" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag2-head-purple)"/><rect x="360" y="380" width="44" height="34" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><rect x="425" y="380" width="90" height="34" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><rect x="550" y="380" width="90" height="34" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><path d="M404,397 L425,397" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ag2-head-red)"/><path d="M515,388 L550,388" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ag2-head-red)"/><path d="M550,406 L515,406" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag2-head-red)"/><rect x="565" y="445" width="60" height="34" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><path d="M595,414 L595,445" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ag2-head-red)"/><rect x="690" y="380" width="60" height="34" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><rect x="780" y="380" width="70" height="34" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><rect x="880" y="380" width="90" height="34" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><path d="M750,397 L780,397" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#ag2-head-ink)"/><path d="M850,388 L880,388" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag2-head-purple)"/><path d="M880,406 L850,406" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag2-head-orange)"/><rect x="780" y="445" width="70" height="34" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><path d="M815,414 L815,445" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ag2-head-purple)"/><g transform="rotate(0.3 500.0 546.0)"><rect x="23" y="528" width="960" height="44" fill="#00000014"/><rect x="20" y="524" width="960" height="44" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Workflow patterns (fixed paths) vs an agent (the model picks the path)</text><text x="32" y="80" font-size="14" fill="#1f5fbf" text-anchor="start" font-weight="bold" style="">1 Prompt chaining</text><text x="32" y="266" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">e.g. outline → check → write</text><text x="362" y="80" font-size="14" fill="#c55a11" text-anchor="start" font-weight="bold" style="">2 Routing</text><text x="362" y="266" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">e.g. billing / tech / refund bot</text><text x="692" y="80" font-size="14" fill="#0b7a4b" text-anchor="start" font-weight="bold" style="">3 Parallel</text><text x="692" y="266" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">e.g. security + bugs + tests passes</text><text x="32" y="314" font-size="14" fill="#6f42c1" text-anchor="start" font-weight="bold" style="">4 Orchestrator–workers</text><text x="32" y="500" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">e.g. plan, then edit N files</text><text x="362" y="314" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold" style="">5 Evaluator–optimizer</text><text x="362" y="500" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">e.g. write → critique → fix</text><text x="692" y="314" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">6 Agent (autonomous)</text><text x="692" y="500" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic" style="">e.g. a coding agent</text><text x="52.0" y="148" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">In</text><text x="123.0" y="148" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">LLM 1</text><text x="202.0" y="148" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">check</text><text x="279.0" y="148" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">LLM 2</text><text x="279.0" y="218" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Out</text><text x="123.0" y="218" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">stop</text><text x="202.0" y="181.5" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">fail</text><text x="382.0" y="178" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">In</text><text x="465.0" y="178" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Router</text><text x="595.0" y="128" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">billing</text><text x="595.0" y="178" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">tech</text><text x="595.0" y="228" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">refund</text><text x="712.0" y="178" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">In</text><text x="930.0" y="178" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">merge</text><text x="805.0" y="128" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="805.0" y="178" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="805.0" y="228" font-size="12" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="80.0" y="412" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Orchestrator</text><text x="280.0" y="412" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">merge</text><text x="193.0" y="362" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">worker</text><text x="193.0" y="412" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">worker</text><text x="193.0" y="462" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">worker</text><text x="80" y="450" font-size="10" fill="#6f42c1" text-anchor="middle" font-weight="normal" font-style="italic" style="">plans at run time</text><text x="382.0" y="402" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">In</text><text x="470.0" y="402" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Generator</text><text x="595.0" y="402" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Evaluator</text><text x="532.5" y="381.0" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">draft</text><text x="532.5" y="420.0" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">fix this</text><text x="595.0" y="467" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Out</text><text x="601.0" y="433.5" font-size="10" fill="#c0392b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">good</text><text x="720.0" y="402" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Human</text><text x="815.0" y="402" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="925.0" y="402" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Tools / env</text><text x="865.0" y="381.0" font-size="10" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">action</text><text x="865.0" y="420.0" font-size="10" fill="#c55a11" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">result</text><text x="815.0" y="467" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Done</text><text x="821.0" y="433.5" font-size="10" fill="#6f42c1" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">stop</text><g transform="rotate(0.3 500.0 546.0)"><text x="32" y="548" font-size="12" fill="#2b2b2b" font-weight="bold">Fixed workflows are cheaper, faster and easier to test. Use an agent only when the steps can&#x27;t be known in advance.</text></g></svg>
