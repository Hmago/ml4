e-width="1.2"/><rect x="490" y="50" width="250" height="150" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="496" y1="81" x2="734" y2="81" stroke="#c0392b" stroke-width="1.2"/><path d="M780,72 V178 A100.0,12 0 0 0 980,178 V72" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><ellipse cx="880.0" cy="72" rx="100.0" ry="12" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><path d="M190,125 L230,125" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#l11-head-ink)" marker-start="url(#l11-head-ink)"/><path d="M450,125 L490,125" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#l11-head-blue)"/><path d="M740,125 L780,125" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#l11-head-red)"/><rect x="230" y="240" width="220" height="66" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><line x1="236" y1="271" x2="444" y2="271" stroke="#6b7280" stroke-width="1.2"/><rect x="490" y="240" width="250" height="66" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="496" y1="271" x2="734" y2="271" stroke="#c55a11" stroke-width="1.2"/><path d="M340,194 L340,240" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#l11-head-gray)"/><path d="M615,200 L615,240" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#l11-head-orange)"/><g transform="rotate(1.2 880.0 277.0)"><rect x="783" y="226" width="200" height="110" fill="#00000014"/><rect x="780" y="222" width="200" height="110" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">L11 · An MCP server that lets agents query MongoDB safely</text><text x="105.0" y="102" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">AI client</text><text x="105.0" y="130" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Copilot · Claude ·</text><text x="105.0" y="147" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">any MCP agent</text><text x="340.0" y="78" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">MCP server: tools</text><text x="240" y="106" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">listCollections</text><text x="240" y="126" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">getSchemaSample</text><text x="240" y="146" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">find(filter, limit)</text><text x="240" y="166" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">aggregate(pipeline)</text><text x="615.0" y="72" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Guard layer</text><text x="500" y="100" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">read-only DB user</text><text x="500" y="120" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">block $out / $merge</text><text x="500" y="140" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">force $limit + maxTimeMS</text><text x="500" y="160" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">redact PII fields</text><text x="500" y="180" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">DB allow-list</text><text x="880.0" y="102" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">MongoDB</text><text x="880.0" y="124" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">only allowed</text><text x="880.0" y="143" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">databases</text><text x="105" y="192" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic" style="">speaks MCP (JSON-RPC)</text><text x="340.0" y="262" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold" style="">Audit log</text><text x="340.0" y="290" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">who · which tool · rows</text><text x="615.0" y="262" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Rate limit</text><text x="615.0" y="290" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">per client (C11)</text><g transform="rotate(1.2 880.0 277.0)"><text x="792" y="246" font-size="12" fill="#2b2b2b" font-weight="bold">Tip</text><text x="792" y="267" font-size="12" fill="#2b2b2b">MongoDB ships an</text><text x="792" y="288" font-size="12" fill="#2b2b2b">official MCP server</text><text x="792" y="309" font-size="12" fill="#2b2b2b">(read-only mode)</text></g><text x="20" y="360" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" style="">Tool output goes back to the model as DATA, not instructions (prompt injection) · least privilege everywhere</text></svg>
