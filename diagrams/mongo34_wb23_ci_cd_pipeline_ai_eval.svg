<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" aria-label="A CI/CD pipeline (with an AI eval gate)"><defs><filter id="sd3-rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="sd3-head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#0b7a4b"/></marker><marker id="sd3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2b2b2b"/></marker><marker id="sd3-head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#c0392b"/></marker></defs><rect width="1000" height="520" fill="#fbfbf6"/><g filter="url(#sd3-rough)"><rect x="20" y="76" width="120" height="84" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="26" y1="107" x2="134" y2="107" stroke="#2b2b2b" stroke-width="1.2"/><rect x="160" y="76" width="120" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="166" y1="107" x2="274" y2="107" stroke="#1f5fbf" stroke-width="1.2"/><rect x="300" y="76" width="140" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="306" y1="107" x2="434" y2="107" stroke="#1f5fbf" stroke-width="1.2"/><rect x="460" y="76" width="150" height="84" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="466" y1="107" x2="604" y2="107" stroke="#6f42c1" stroke-width="1.2"/><rect x="630" y="76" width="140" height="84" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.2"/><line x1="636" y1="107" x2="764" y2="107" stroke="#2b2b2b" stroke-width="1.2"/><rect x="790" y="76" width="190" height="84" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="796" y1="107" x2="974" y2="107" stroke="#0b7a4b" stroke-width="1.2"/><path d="M140,118 L160,118" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd3-head-ink)"/><path d="M280,118 L300,118" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd3-head-ink)"/><path d="M440,118 L460,118" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd3-head-ink)"/><path d="M610,118 L630,118" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd3-head-ink)"/><path d="M770,118 L790,118" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd3-head-ink)"/><rect x="20" y="236" width="160" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="26" y1="267" x2="174" y2="267" stroke="#1f5fbf" stroke-width="1.2"/><rect x="220" y="236" width="160" height="84" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="226" y1="267" x2="374" y2="267" stroke="#c55a11" stroke-width="1.2"/><rect x="420" y="236" width="160" height="84" rx="10" fill="#ffffff" stroke="#0b7a4b" stroke-width="2.2"/><line x1="426" y1="267" x2="574" y2="267" stroke="#0b7a4b" stroke-width="1.2"/><rect x="620" y="236" width="160" height="84" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="626" y1="267" x2="774" y2="267" stroke="#1f5fbf" stroke-width="1.2"/><rect x="820" y="236" width="160" height="84" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><line x1="826" y1="267" x2="974" y2="267" stroke="#c0392b" stroke-width="1.2"/><path d="M180,278 L220,278" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd3-head-ink)"/><path d="M380,278 L420,278" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd3-head-ink)"/><path d="M580,278 L620,278" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#sd3-head-ink)"/><path d="M780,278 L820,278" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#sd3-head-red)"/><path d="M885,160 L885,196 L100,196 L100,236" fill="none" stroke="#0b7a4b" stroke-width="2" marker-end="url(#sd3-head-green)"/><path d="M300,320 L300,346 L900,346 L900,320" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#sd3-head-red)"/><g transform="rotate(-0.6 320.0 438.0)"><rect x="23" y="376" width="600" height="132" fill="#00000014"/><rect x="20" y="372" width="600" height="132" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g><rect x="650" y="380" width="330" height="116" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.2"/><line x1="656" y1="411" x2="974" y2="411" stroke="#1f5fbf" stroke-width="1.2"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">A CI/CD pipeline (with an AI eval gate)</text><text x="20" y="62" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold" style="">CI: every change</text><text x="80.0" y="98" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Commit / PR</text><text x="80.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">push</text><text x="80.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">open PR</text><text x="220.0" y="98" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Build</text><text x="220.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">compile</text><text x="220.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">cache deps</text><text x="370.0" y="98" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Test</text><text x="370.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">unit · integration</text><text x="370.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">lint · SAST</text><text x="535.0" y="98" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">AI eval gate</text><text x="535.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">golden set score</text><text x="535.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">≥ main branch</text><text x="700.0" y="98" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Review + merge</text><text x="700.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">1 approval</text><text x="700.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">all checks green</text><text x="885.0" y="98" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Image</text><text x="885.0" y="126" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">build once, sign,</text><text x="885.0" y="145" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">push to registry</text><text x="980" y="224" font-size="13" fill="#6b7280" text-anchor="end" font-weight="bold" style="">CD: deploy the same image step by step</text><text x="100.0" y="258" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Staging</text><text x="100.0" y="286" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">deploy + smoke</text><text x="100.0" y="305" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ e2e tests</text><text x="300.0" y="258" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Canary 5%</text><text x="300.0" y="286" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">watch errors,</text><text x="300.0" y="305" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">latency, cost</text><text x="500.0" y="258" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Roll out 100%</text><text x="500.0" y="286" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">progressive or</text><text x="500.0" y="305" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">blue/green</text><text x="700.0" y="258" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Monitor</text><text x="700.0" y="286" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">SLOs · alerts</text><text x="700.0" y="305" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">eval drift</text><text x="900.0" y="258" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Rollback</text><text x="900.0" y="286" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">automatic if SLO</text><text x="900.0" y="305" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">breaks (old image)</text><text x="800.0" y="271.0" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">bad?</text><text x="600.0" y="360.0" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">canary looks bad → stop</text><g transform="rotate(-0.6 320.0 438.0)"><text x="32" y="396" font-size="12" fill="#2b2b2b" font-weight="bold">For AI apps, also</text><text x="32" y="417" font-size="12" fill="#2b2b2b">pin model + prompt versions (like dependencies)</text><text x="32" y="438" font-size="12" fill="#2b2b2b">run evals in CI like unit tests</text><text x="32" y="459" font-size="12" fill="#2b2b2b">feature flags to switch models / prompts fast</text><text x="32" y="480" font-size="12" fill="#2b2b2b">watch quality and $ cost after release, not just errors</text></g><text x="815.0" y="402" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">GitOps (optional)</text><text x="815.0" y="430" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">desired state lives in Git</text><text x="815.0" y="449" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Argo CD / Flux syncs the cluster</text><text x="815.0" y="468" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">rollback = git revert</text></svg>
