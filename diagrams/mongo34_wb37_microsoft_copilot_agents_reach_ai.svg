idth="260" height="58" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="376" y1="261" x2="624" y2="261" stroke="#6f42c1" stroke-width="1.2"/><rect x="370" y="312" width="260" height="40" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><rect x="370" y="376" width="260" height="97" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/><line x1="376" y1="407" x2="624" y2="407" stroke="#6f42c1" stroke-width="1.2"/><path d="M500,288 L500,312" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai7-head-purple)"/><path d="M500,352 L500,376" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#ai7-head-purple)"/><rect x="672" y="170" width="308" height="330" rx="10" fill="none" stroke="#c55a11" stroke-width="2" stroke-dasharray="8 6"/><rect x="696" y="230" width="260" height="58" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="702" y1="261" x2="950" y2="261" stroke="#c55a11" stroke-width="1.2"/><rect x="696" y="312" width="260" height="40" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><rect x="696" y="376" width="260" height="78" rx="10" fill="#ffffff" stroke="#c55a11" stroke-width="2.2"/><line x1="702" y1="407" x2="950" y2="407" stroke="#c55a11" stroke-width="1.2"/><path d="M826,288 L826,312" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#ai7-head-orange)"/><path d="M826,352 L826,376" fill="none" stroke="#c55a11" stroke-width="2" marker-end="url(#ai7-head-orange)"/><rect x="20" y="516" width="960" height="78" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">How Microsoft Copilot agents reach an AI model</text><text x="90.0" y="78" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">User prompt</text><text x="90.0" y="106" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Teams / Copilot</text><text x="250.0" y="78" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Orchestrator</text><text x="250.0" y="106" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">plans, picks tools</text><text x="410.0" y="78" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Grounding</text><text x="410.0" y="106" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Microsoft Graph</text><text x="570.0" y="78" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">LLM</text><text x="570.0" y="106" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">generates</text><text x="730.0" y="78" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Safety checks</text><text x="730.0" y="106" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">responsible AI</text><text x="890.0" y="78" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Answer</text><text x="890.0" y="106" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">back to the app</text><text x="410" y="144" font-size="11" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="">only data the user can access</text><text x="174" y="196" font-size="15" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Declarative agent</text><text x="174" y="216" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">Agent Builder · Agents Toolkit</text><text x="174.0" y="252" font-size="13" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">You add</text><text x="174.0" y="280" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">instructions, knowledge, actions</text><text x="174.0" y="334" font-size="13" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Copilot&#x27;s orchestrator</text><text x="174.0" y="398" font-size="13" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Model</text><text x="174.0" y="426" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Copilot&#x27;s models</text><text x="174.0" y="444" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">(you don&#x27;t pick one)</text><text x="174" y="490" font-size="11" fill="#1f5fbf" text-anchor="middle" font-weight="normal" font-style="italic" style="">Inherits M365 security + compliance</text><text x="500" y="196" font-size="15" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Copilot Studio agent</text><text x="500" y="216" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">low-code</text><text x="500.0" y="252" font-size="13" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">You pick a primary model</text><text x="500.0" y="280" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">from a dropdown</text><text x="500.0" y="334" font-size="13" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Generative orchestration</text><text x="500.0" y="398" font-size="13" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Model</text><text x="500.0" y="426" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">GPT (default: GPT Chat Latest)</text><text x="500.0" y="444" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Claude · Mistral · xAI (admin on)</text><text x="500.0" y="462" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Prompt tool: Foundry models</text><text x="500" y="490" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" font-style="italic" style="">Default auto-upgrades; falls back if off</text><text x="826" y="196" font-size="15" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Custom engine agent</text><text x="826" y="216" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" style="">Agents SDK · Agent Framework</text><text x="826.0" y="252" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">You build</text><text x="826.0" y="280" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">the orchestrator</text><text x="826.0" y="334" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Your own code</text><text x="826.0" y="398" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Model</text><text x="826.0" y="426" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Any model: Azure OpenAI,</text><text x="826.0" y="444" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Foundry, fine-tuned, small</text><text x="826" y="490" font-size="11" fill="#c55a11" text-anchor="middle" font-weight="normal" font-style="italic" style="">You own hosting, security, RAI</text><text x="36" y="540" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold" style="">Admin controls:</text><text x="36" y="562" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">external providers on/off (e.g. Anthropic as a Microsoft subprocessor) · preview &amp; experimental models</text><text x="36" y="582" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">cross-geo data movement (data may leave your region) · model retirement dates</text></svg>
