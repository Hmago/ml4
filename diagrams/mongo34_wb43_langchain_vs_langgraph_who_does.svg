Graph = the engine</text><text x="365.0" y="274" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">state · nodes · edges · checkpoints · interrupts · streaming</text><text x="373.0" y="144.0" font-size="11" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">built on</text><text x="373.0" y="228.0" font-size="11" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">built on</text><text x="130.0" y="336" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">Models</text><text x="130.0" y="364" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">OpenAI · Anthropic · …</text><text x="365.0" y="336" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Tools / MCP</text><text x="365.0" y="364" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">APIs · DB queries</text><text x="600.0" y="336" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">MongoDB Atlas</text><text x="600.0" y="364" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">vectors · checkpoints · memory</text><text x="373.0" y="317.0" font-size="11" fill="#0b7a4b" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">calls</text><text x="860.0" y="78" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">LangSmith</text><text x="860.0" y="106" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">traces every LLM</text><text x="860.0" y="130" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ tool call</text><text x="860.0" y="154" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">evals + datasets</text><text x="860.0" y="178" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">prompt versions</text><text x="860.0" y="202" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">deploy agents</text><text x="860.0" y="226" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style=""></text><text x="860.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">works with any</text><text x="860.0" y="274" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">framework</text><g transform="rotate(0.4 500.0 426.0)"><text x="32" y="422" font-size="12" fill="#2b2b2b" font-weight="bold">Rule of thumb: start with LangChain create_agent; drop down to LangGraph when you need</text><text x="32" y="442" font-size="12" fill="#2b2b2b">custom steps, human approval, resume after a crash, or multi-agent flows.</text></g></svg>
