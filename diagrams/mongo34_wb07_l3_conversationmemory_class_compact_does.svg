="30" y="122" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- budget = window − answer reserve</text><text x="30" y="142" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- turns: List&lt;Message&gt;</text><text x="30" y="162" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- summary: String</text><text x="30" y="182" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">+ add(role, text)</text><text x="30" y="202" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">+ pin(role, text)</text><text x="30" y="222" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">+ context(): List&lt;Message&gt;</text><text x="30" y="242" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">- compact()</text><text x="90.0" y="307" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" font-style="italic" style="">«interface»</text><text x="90.0" y="325" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">TokenCounter</text><text x="30" y="353" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">count(text)</text><text x="250.0" y="307" font-size="11" fill="#6f42c1" text-anchor="middle" font-weight="normal" font-style="italic" style="">«interface»</text><text x="250.0" y="325" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Summarizer</text><text x="190" y="353" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="normal" style="">summarize(...)</text><text x="380" y="66" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold" style="">Before: over budget</text><text x="413" y="99" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">t1</text><text x="413" y="115" font-size="10" fill="#c55a11" text-anchor="middle" font-weight="normal" style="">evict</text><text x="487" y="99" font-size="13" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">t2</text><text x="487" y="115" font-size="10" fill="#0b7a4b" text-anchor="middle" font-weight="normal" style="">pinned</text><text x="561" y="99" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">t3</text><text x="561" y="115" font-size="10" fill="#c55a11" text-anchor="middle" font-weight="normal" style="">evict</text><text x="635" y="99" font-size="13" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">t4</text><text x="635" y="115" font-size="10" fill="#c55a11" text-anchor="middle" font-weight="normal" style="">evict</text><text x="709" y="99" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">t5</text><text x="709" y="115" font-size="10" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style=""></text><text x="783" y="99" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">t6</text><text x="783" y="115" font-size="10" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style=""></text><text x="857" y="99" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">t7</text><text x="857" y="115" font-size="10" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style=""></text><text x="931" y="99" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">t8</text><text x="931" y="115" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="normal" style="">newest</text><text x="680.0" y="167.0" font-size="12" fill="#c55a11" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">evict oldest unpinned until ≤ 75% of budget</text><text x="380" y="214" font-size="13" fill="#0b7a4b" text-anchor="start" font-weight="bold" style="">After</text><text x="480" y="253" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">summary(t1, t3, t4)</text><text x="623" y="253" font-size="13" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">t2</text><text x="697" y="253" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">t5</text><text x="771" y="253" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">t6</text><text x="845" y="253" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" style="">t7</text><text x="919" y="253" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">t8</text><text x="380" y="300" font-size="12" fill="#c55a11" text-anchor="start" font-weight="normal" style="">t1, t3, t4 → Summarizer → one summary (capped at budget ÷ 4)</text><g transform="rotate(-0.6 680.0 368.0)"><text x="392" y="346" font-size="12" fill="#2b2b2b" font-weight="bold">Rules</text><text x="392" y="368" font-size="12" fill="#2b2b2b">never evict pinned turns or the newest turn · summarize in batches (75%), not every turn</text><text x="392" y="390" font-size="12" fill="#2b2b2b">context() = system + summary + turns, in that order</text></g></svg>
