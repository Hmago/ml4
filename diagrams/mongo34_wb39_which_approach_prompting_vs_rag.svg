otate(1.5 840.0 370.0)"><rect x="703" y="304" width="280" height="140" fill="#00000014"/><rect x="700" y="300" width="280" height="140" fill="#fff3a0" stroke="#d6c14a" stroke-width="1.2"/></g></g><text x="20" y="34" font-size="19" fill="#2b2b2b" text-anchor="start" font-weight="bold" style="">Which approach? Prompting vs RAG vs the alternatives</text><text x="250" y="107" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Needs knowledge the</text><text x="250" y="125" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">model doesn&#x27;t have?</text><text x="545.0" y="104" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Prompting + few-shot</text><text x="412.5" y="105.0" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">no</text><text x="258.0" y="186.0" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="250" y="247" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Structured / live data?</text><text x="250" y="265" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">(DB, APIs, metrics)</text><text x="550.0" y="242" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Tool use / text-to-MQL</text><text x="550.0" y="270" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">query the source of truth</text><text x="412.5" y="245.0" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="258.0" y="326.0" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">no</text><text x="250" y="387" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">Small, stable corpus</text><text x="250" y="405" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" style="">that fits the window?</text><text x="550.0" y="382" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Long context / CAG</text><text x="550.0" y="410" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">put it all in + prompt cache</text><text x="412.5" y="385.0" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="258.0" y="462.0" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">no</text><text x="250.0" y="494" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">RAG</text><text x="250.0" y="522" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">hybrid search + rerank</text><text x="250.0" y="539" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">+ citations</text><text x="520" y="504" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Multi-hop or</text><text x="520" y="522" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">&quot;summarize everything&quot;?</text><text x="835.0" y="500" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">GraphRAG / agentic RAG</text><text x="835.0" y="528" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">connect the dots across docs</text><text x="662.5" y="502.0" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><text x="830" y="107" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Need a behavior,</text><text x="830" y="125" font-size="12" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">format or style?</text><text x="830.0" y="222" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Fine-tune (LoRA) / distill</text><text x="830.0" y="250" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">form, not facts · cheaper model</text><text x="838.0" y="186.0" font-size="12" fill="#c55a11" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fbfbf6;stroke-width:5px;stroke-linejoin:round">yes</text><g transform="rotate(1.5 840.0 370.0)"><text x="712" y="324" font-size="12" fill="#2b2b2b" font-weight="bold">Combine them</text><text x="712" y="346" font-size="12" fill="#2b2b2b">RAG for documents</text><text x="712" y="368" font-size="12" fill="#2b2b2b">tools for live numbers</text><text x="712" y="390" font-size="12" fill="#2b2b2b">fine-tune for form</text><text x="712" y="412" font-size="12" fill="#2b2b2b">let evals decide</text></g></svg>
