fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">a to-do list</text><text x="550.0" y="232" font-size="14" fill="#c55a11" text-anchor="middle" font-weight="bold" style="">Sub-agents</text><text x="550.0" y="260" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">delegate side tasks</text><text x="130.0" y="342" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Context mgmt</text><text x="130.0" y="370" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">summarize · offload</text><text x="340.0" y="342" font-size="14" fill="#0b7a4b" text-anchor="middle" font-weight="bold" style="">Memory / files</text><text x="340.0" y="370" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">notes that persist</text><text x="550.0" y="342" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" style="">Safety</text><text x="550.0" y="370" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">ask before risky steps</text><text x="340.0" y="232" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Model (LLM)</text><text x="340.0" y="260" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">the brain: predicts text</text><text x="835.0" y="78" font-size="14" fill="#6f42c1" text-anchor="middle" font-weight="bold" style="">Analogy</text><text x="835.0" y="106" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">model = the car engine</text><text x="835.0" y="128" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">harness = the rest of the car:</text><text x="835.0" y="150" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">steering · brakes · GPS</text><text x="835.0" y="172" font-size="12" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">same engine, better car</text><g transform="rotate(1.0 835.0 324.0)"><text x="702" y="252" font-size="12" fill="#2b2b2b" font-weight="bold">Examples of harnesses</text><text x="702" y="278" font-size="12" fill="#2b2b2b">Deep Agents SDK (LangChain)</text><text x="702" y="304" font-size="12" fill="#2b2b2b">Claude Agent SDK</text><text x="702" y="330" font-size="12" fill="#2b2b2b">coding CLIs:</text><text x="702" y="356" font-size="12" fill="#2b2b2b">  GitHub Copilot CLI</text><text x="702" y="382" font-size="12" fill="#2b2b2b">  Claude Code · Codex CLI</text></g><text x="500" y="470" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="normal" style="">Same model + a better harness = much better results (&quot;harness / context engineering&quot;)</text></svg>
